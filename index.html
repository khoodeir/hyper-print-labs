<!-- ===== Hyper Print Labs · Redesign "Pop Studio" =====
     الصق هذا البلوك كله قبل </head> مباشرة (بعد الـ <style> الأصلي) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style id="redesign">
:root{
  --paper:#FFF7EC; --paper-soft:#FFEFD6; --ink:#1F1B3A; --ink-soft:#6A6788;
  --ember:#FF5D8F; --ember-deep:#6C4CF1; --signal-deep:#19C3A0;
  --line:#EADFCB; --radius:16px; --radius-lg:28px;
  --pop:5px 5px 0 #1F1B3A; --pop-sm:3px 3px 0 #1F1B3A;
  --violet:#6C4CF1; --pink:#FF5D8F; --sun:#FFC940; --mint:#19C3A0;
  --shadow:var(--pop); --shadow-soft:var(--pop-sm);
  --font-mono:'Fredoka','Cairo',sans-serif;
}
html:not([lang="ar"]){--font-display:'Fredoka',sans-serif;}
html[lang="ar"]{--font-display:'Baloo Bhaijaan 2','Cairo',sans-serif;}
html:not([lang="ar"]) h1,html:not([lang="ar"]) h2,html:not([lang="ar"]) h3,html:not([lang="ar"]) .display{text-transform:none;letter-spacing:0;}
body{background:var(--paper);color:var(--ink);}
:focus-visible{outline:3px solid var(--pink);}

/* Header */
.topbar{background:rgba(255,247,236,.9);backdrop-filter:blur(10px);border-bottom:2px solid var(--ink);}
.brand-name{color:var(--ink);text-transform:none!important;letter-spacing:0;font-size:21px;}
.logo-mark rect{fill:#fff;}
.logo-mark rect[width="56"]{fill:var(--violet);}
.icon-btn,.admin-link{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop-sm);}
.icon-btn:hover,.admin-link:hover{transform:translate(-1px,-1px);border-color:var(--ink);background:var(--sun);}
.cart-count{background:var(--pink);color:#fff;border:2px solid var(--ink);}
.close-x{color:#fff;}

/* Hero */
.hero{
  background-image:radial-gradient(circle at 88% 18%,rgba(255,201,64,.6),transparent 28%),
    radial-gradient(circle at 8% 92%,rgba(25,195,160,.5),transparent 30%),
    linear-gradient(135deg,#6C4CF1 0%,#A34BEE 55%,#FF5D8F 100%);
  animation:none;color:#fff;border-radius:0 0 48px 48px;padding-bottom:64px;
  border-bottom:2px solid var(--ink);
}
.hero-smoke,.hero-texture,.hero-seam{display:none;}
.hero h1{color:#fff;font-size:clamp(38px,6vw,64px);line-height:1.1;}
.hero p{color:rgba(255,255,255,.9);}
.hero-eyebrow{color:var(--sun);}
.hero-eyebrow .dot{background:var(--sun);box-shadow:0 0 0 4px rgba(255,201,64,.3);}
.cta-btn{background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop);}
.cta-btn:hover{background:#FFD85E;transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);}
.hero-scene svg>line{stroke:rgba(255,255,255,.55);}
.hero-scene svg>circle{fill:rgba(255,255,255,.6);}
.hero-scene svg>rect{fill:#fff;}
.hero-scene svg>ellipse{opacity:.15;}
.live-head rect,.live-head path{fill:#fff;}
.trust-strip{margin-top:-28px;position:relative;z-index:3;}

/* Custom strip */
.custom-card{background:var(--sun);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--pop);}
.custom-card::before{display:none;}
.custom-card-copy .eyebrow{color:var(--violet);}
.custom-card-copy h3{color:var(--ink);}
.custom-card-copy p{color:#4A3F10;}
.custom-btn{border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop-sm);}
.custom-btn-maker{background:var(--ink);color:#fff;}
.custom-btn-maker:hover{background:var(--violet);}
.custom-btn-whatsapp{background:#25D366;color:var(--ink);}

/* Trust + FAQ */
.trust-item{border:2px solid var(--ink);border-radius:20px;box-shadow:var(--pop-sm);}
.trust-item:nth-child(1) .ic{background:#EFE9FF;color:var(--violet);}
.trust-item:nth-child(2) .ic{background:#DDF7F0;color:#0E8F76;}
.trust-item:nth-child(3) .ic{background:#FFE3EC;color:#D93A6E;}
.trust-item:nth-child(4) .ic{background:#FFF1C2;color:#9A6B00;}
.trust-item .ic{border-radius:14px;}
.faq-item{border-bottom:2px dashed var(--line);}
.faq-q .chev{color:var(--pink);}
.faq-q:hover{color:var(--violet);}

/* Section + toolbar */
.section-head{border-bottom:2px solid var(--ink);}
.section-head .eyebrow{color:var(--pink);}
.section-count{background:var(--ink);color:#fff;padding:4px 12px;border-radius:999px;}
.toolbar-search input,.toolbar-sort select{border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop-sm);}
.toolbar-search input:focus,.toolbar-sort select:focus{border-color:var(--violet);}

/* Products */
.product-card{border:2px solid var(--ink);border-radius:24px;box-shadow:var(--pop);}
.product-card:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink);border-color:var(--ink);}
.product-media{background:#EFE9FF;border-bottom:2px solid var(--ink);}
.product-card:nth-child(3n+2) .product-media{background:#FFE3EC;}
.product-card:nth-child(3n) .product-media{background:#DDF7F0;}
.product-media::after{display:none;}
.badge{background:var(--pink);color:#fff;border:2px solid var(--ink);box-shadow:var(--pop-sm);}
.price{color:var(--violet);}
.product-card:hover .price{color:var(--pink);}
.price-row{border-top:2px dashed var(--line);}
.add-btn{background:var(--violet);color:#fff;border:2px solid var(--ink);border-radius:999px;}
.add-btn:hover{background:var(--pink);box-shadow:var(--pop-sm);}
.stars-row .star-filled{color:var(--sun);}
.empty-state{border:2px dashed var(--ink);}

/* Product page */
.pd-main-wrap{background:#EFE9FF;border:2px solid var(--ink);box-shadow:var(--pop);}
.pd-nav{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:50%;}
.pd-nav:hover{background:var(--sun);}
.pd-dot.active{background:var(--violet);}
.pd-thumb{background:#EFE9FF;border:2px solid var(--ink);}
.pd-thumb.active{border-color:var(--pink);}
.pd-price{color:var(--violet);}
.pd-qty-btn{border:2px solid var(--ink);border-radius:50%;}
.pd-add-btn{background:var(--violet);border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop);}
.pd-add-btn:hover{background:var(--pink);}
.pd-add-btn.added{background:var(--mint);}
.pd-recommendations{border-top:2px solid var(--ink);}

/* Drawer + forms */
.drawer{border-inline-start:2px solid var(--ink);}
.drawer-head{background:var(--violet);border-bottom:2px solid var(--ink);}
.drawer-head h3{color:#fff;}
.checkout-btn,.save-btn{background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop-sm);}
.checkout-btn:hover:not(:disabled),.save-btn:hover{background:#FFD85E;color:var(--ink);}
.field input,.field textarea{border:2px solid var(--ink);border-radius:14px;}
.field input:focus,.field textarea:focus{border-color:var(--violet);}
.cart-item img,.cart-item .ph,.admin-product-row img,.admin-product-row .ph{background:#EFE9FF;border:2px solid var(--ink);}
.qty-btn,.mini-btn{border:2px solid var(--ink);border-radius:999px;background:#fff;}
.mini-btn:hover,.qty-btn:hover{background:var(--sun);}
.mini-btn.danger{color:#D93A6E;}

/* Admin */
.panel,.admin-gate{border:2px solid var(--ink);box-shadow:var(--pop);}
.tabs{border:2px solid var(--ink);border-radius:999px;box-shadow:var(--pop-sm);}
.tab-btn{border-radius:999px;}
.tab-btn.active{background:var(--violet);}
.order-card{border:2px solid var(--ink);}

/* Floating bits + toast */
.toast{background:var(--ink);color:#fff;border-radius:999px;}
.back-to-top{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:var(--pop-sm);}
.float-whatsapp{border:2px solid var(--ink);box-shadow:var(--pop-sm);}

/* Intro */
.intro-overlay{background:linear-gradient(135deg,#6C4CF1,#FF5D8F);}
.intro-name{color:#fff;}
.intro-percent{color:var(--sun);}
.intro-percent::after,.intro-layer-count,.intro-caption{color:rgba(255,255,255,.8);}
.intro-underline{background:var(--sun);}
.intro-rig line{stroke:rgba(255,255,255,.55);}
.intro-rig circle{fill:rgba(255,255,255,.6);}
.intro-rig>rect{fill:#fff;}
.intro-head rect,.intro-head path{fill:var(--sun);}
.intro-layers rect:nth-child(1){fill:#fff;}
.intro-layers rect:nth-child(2){fill:var(--mint);}
.intro-layers rect:nth-child(3){fill:#8FD3FF;}
.intro-layers rect:nth-child(4){fill:#B9A4FF;}
.intro-layers rect:nth-child(5){fill:#FF9F43;}
.intro-layers rect:nth-child(6){fill:#FFD85E;}
.intro-layers rect:nth-child(7){fill:var(--sun);}
@media(max-width:640px){.hero{border-radius:0 0 32px 32px;}.product-card{box-shadow:var(--pop-sm);}}
</style>
