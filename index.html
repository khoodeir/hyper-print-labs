  function renderProduct(){
    const p = state.products.find(x=>String(x.id)===String(state.selectedProductId));
    if(!p){
      return `
        ${topbar()}
        <div class="pd-wrap">
          <a href="#" class="pd-back" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
          <p>${esc(t('productUnavailable'))}</p>
        </div>
        ${renderDrawer()}
      `;
    }
    const imgs = productImages(p);
    const idx = Math.min(state.pdGalleryIndex, Math.max(imgs.length-1,0));
    const current = imgs[idx];
    const related = state.products.filter(item=>String(item.id)!==String(p.id)).slice(0,4);
    const relatedTitle = state.lang==='ar' ? 'منتجات قد تعجبك' : 'You may also like';
    const relatedCount = state.lang==='ar' ? 'اختيارات أخرى' : 'More pieces';

    const mainInner = current
      ? `<img src="${esc(current)}" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML=window.__actions._placeholderSvg()">`
      : printPlaceholderIcon();

    return `
      ${topbar()}
      <div class="pd-wrap">
        <a href="#" class="pd-back" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
        <div class="pd-grid">
          <div class="pd-gallery">
            <div class="pd-main-wrap" id="pdMainWrap">
              ${imgs.length>1 ? `<button class="pd-nav pd-nav-prev" type="button" onclick="__actions.pdPrev()" aria-label="Previous image">‹</button>` : ''}
              <div class="pd-main" id="pdMainImage">${mainInner}</div>
              ${imgs.length>1 ? `<button class="pd-nav pd-nav-next" type="button" onclick="__actions.pdNext()" aria-label="Next image">›</button>` : ''}
              ${imgs.length>1 ? `<div class="pd-dots">${imgs.map((_,i)=>`<div class="pd-dot ${i===idx?'active':''}" onclick="__actions.pdGoTo(${i})"></div>`).join('')}</div>` : ''}
            </div>
            ${imgs.length>1 ? `
              <div class="pd-thumbs">
                ${imgs.map((src,i)=>`
                  <div class="pd-thumb ${i===idx?'active':''}" onclick="__actions.pdGoTo(${i})">
                    <img src="${esc(src)}" alt="View ${i+1}" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML=window.__actions._placeholderSvg()">
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
          <div class="pd-info">
            <h1 class="pd-title">${esc(p.name)}</h1>
            <div class="pd-stars">${starsHtml(p.rating, p.reviews_count)}</div>
            <div class="pd-price">${money(p.price)}</div>
            ${p.description ? `<p class="pd-desc">${esc(p.description)}</p>` : ''}
            <div class="pd-qty-row">
              <button class="pd-qty-btn" type="button" onclick="__actions.pdChangeQty(-1)" aria-label="Decrease quantity">−</button>
              <span class="pd-qty-value">${state.pdQty}</span>
              <button class="pd-qty-btn" type="button" onclick="__actions.pdChangeQty(1)" aria-label="Increase quantity">+</button>
            </div>
            <button class="pd-add-btn" type="button" id="pdAddBtn" onclick="__actions.addToCartFromProduct('${p.id}')">
              <span>${esc(t('addToCart'))}</span>
            </button>
          </div>
        </div>
        ${hasComplete3D(p) ? dimensionViewer(p) : ''}
        ${reviewsSection(p)}
        ${related.length ? `
          <section class="pd-recommendations">
            <div class="section-head" style="border-bottom:none;padding-bottom:0;">
              <div>
                <span class="eyebrow">${esc(relatedCount)}</span>
                <h2>${esc(relatedTitle)}</h2>
              </div>
              <a href="#" class="view-all" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
            </div>
            <div class="grid">
              ${related.map(item=>`
                <div class="product-card" onclick="__actions.viewProduct('${item.id}')">
                  ${item.badge ? `<span class="badge">${esc(item.badge)}</span>` : ''}
                  ${productMedia(item)}
                  <div class="product-body">
                    <h3>${esc(item.name)}</h3>
                    ${starsHtml(item.rating, item.reviews_count)}
                    <div class="price-row">
                      <span class="price">${money(item.price)}</span>
                      <button class="add-btn" type="button" onclick="__actions.addToCartFromCard(event,'${item.id}')">${esc(t('addToCart'))}</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}
      </div>
      ${renderDrawer()}
    `;
  }

  function renderDrawer(){
    const items = cartItems();
    let body;
    if(state.checkoutStep === 'success'){
      body = `
        <div class="success-box">
          ${checkmarkIcon()}
          <h3>${esc(t('orderSuccessTitle'))}</h3>
          <p style="color:var(--ink-soft);line-height:1.7;">${esc(t('orderSuccessDesc'))}</p>
          <button class="checkout-btn" type="button" style="margin-top:16px;" onclick="__actions.closeDrawer()">${esc(t('done'))}</button>
        </div>`;
    } else if(state.checkoutStep === 'form'){
      body = `
        <div class="checkout-intro"><b>${state.lang==='ar'?'بيانات التوصيل':'Delivery details'}</b><span>${state.lang==='ar'?'نراجع طلبك ونتواصل معك للتأكيد':'We will contact you to confirm your order'}</span></div>
        <div class="checkout-mini-summary">${items.map(it=>`<span>${esc(it.name)} × ${it.qty}</span>`).join('')}<strong>${money(cartTotal())}</strong></div>
        <form onsubmit="__actions.submitOrder(event)" novalidate>
          <div class="field"><label>${esc(t('fieldName'))}</label><input name="name" required placeholder="${esc(t('placeholderName'))}"></div>
          <div class="field">
            <label>${esc(t('fieldPhone'))}</label>
            <input name="phone" type="tel" inputmode="tel" required placeholder="${esc(t('placeholderPhone'))}" title="${esc(t('phoneHint'))}">
          </div>
          <div class="field"><label>${esc(t('fieldAddress'))}</label><textarea name="address" rows="2" required placeholder="${esc(t('placeholderAddress'))}"></textarea></div>
          <div class="field"><label>${esc(t('fieldNote'))}</label><textarea name="note" rows="2" placeholder="${esc(t('placeholderNote'))}"></textarea></div>
          <button type="button" class="mini-btn" style="margin-bottom:10px;" onclick="__actions.backToCart()">${esc(t('backToCart'))}</button>
          <button type="submit" class="checkout-btn">${esc(t('confirmOrder'))}</button>
        </form>`;
    } else {
      body = items.length === 0
        ? `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;">${esc(t('cartEmpty'))}</p>`
        : items.map(it=>`
            <div class="cart-item">
              ${it.image ? `<img src="${esc(it.image)}" alt="" onerror="this.outerHTML='<div class=ph>'+window.__actions._placeholderSvg()+'</div>'">` : `<div class="ph">${printPlaceholderIcon()}</div>`}
              <div class="cart-item-info">
                <span class="name">${esc(it.name)}</span>
                <span style="font-size:13px;color:var(--ink-soft);font-family:var(--font-mono);">${money(it.price)}</span>
                <div class="qty-row">
                  <button class="qty-btn" type="button" onclick="__actions.changeQty('${it.id}',-1)" aria-label="Decrease quantity">−</button>
                  <span>${it.qty}</span>
                  <button class="qty-btn" type="button" onclick="__actions.changeQty('${it.id}',1)" aria-label="Increase quantity">+</button>
                  <a href="#" class="remove-link" onclick="__actions.removeFromCart('${it.id}');return false;">${state.lang==='ar'?'حذف':'Remove'}</a>
                </div>
              </div>
            </div>
          `).join('');
    }

    return `
      <div class="overlay ${state.drawerOpen?'open':''}" onclick="__actions.closeDrawer()"></div>
      <aside class="drawer ${state.drawerOpen?'open':''}" role="dialog" aria-modal="true" aria-label="${esc(t('cartTitle'))}">
        <div class="drawer-head">
          <div><h3>${esc(t('cartTitle'))}</h3><div class="checkout-progress"><span class="${state.checkoutStep==='cart'?'active':''}">01 ${state.lang==='ar'?'السلة':'Cart'}</span><i></i><span class="${state.checkoutStep==='form'?'active':''}">02 ${state.lang==='ar'?'البيانات':'Details'}</span></div></div>
          <button class="close-x" type="button" onclick="__actions.closeDrawer()" aria-label="Close">✕</button>
        </div>
        <div class="drawer-body">${body}</div>
        ${state.checkoutStep==='cart' ? `
          <div class="drawer-foot">
            <div class="total-row"><span>${esc(t('total'))}</span><span>${money(cartTotal())}</span></div>
            <button class="checkout-btn" type="button" ${items.length===0?'disabled style="opacity:.5;"':''} onclick="__actions.goToForm()">${esc(t('checkout'))}</button>
          </div>
        ` : ''}
      </aside>
    `;
  }

  function renderAdmin(){
    if(!state.adminAuthed){
      return `
        <header class="topbar">
          <div class="brand">${logoMark()}<div class="brand-name">${esc(t('adminTitle'))}</div></div>
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
        </header>
        <div class="admin-gate">
          ${lockIcon()}
          <h3>${esc(t('adminLoginTitle'))}</h3>
          <p style="color:var(--ink-soft);font-size:13px;">${esc(t('adminLoginDesc'))}</p>
          <form onsubmit="__actions.tryAuth(event)">
            <div class="field"><input name="email" type="email" placeholder="${esc(t('email'))}" required autocomplete="username"></div>
            <div class="field"><input name="password" type="password" placeholder="${esc(t('password'))}" required autocomplete="current-password"></div>
            <button type="submit" class="save-btn" style="width:100%;">${esc(t('logIn'))}</button>
          </form>
        </div>
      `;
    }

    return `
      <header class="topbar">
        <div class="brand">${logoMark()}<div class="brand-name">${esc(t('adminTitle'))}</div></div>
        <div class="topbar-actions">
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
          <a href="#" class="admin-link" onclick="__actions.signOut();return false;">${esc(t('signOut'))}</a>
        </div>
      </header>
      <div class="admin-wrap">
        <div class="tabs" role="tablist">
          <button class="tab-btn ${state.adminTab==='products'?'active':''}" type="button" onclick="__actions.setAdminTab('products')">${esc(t('tabProducts'))}</button>
          <button class="tab-btn ${state.adminTab==='orders'?'active':''}" type="button" onclick="__actions.setAdminTab('orders')">${esc(t('tabOrders'))} (${state.orders.length})</button>
          <button class="tab-btn ${state.adminTab==='settings'?'active':''}" type="button" onclick="__actions.setAdminTab('settings')">${esc(t('tabSettings'))}</button>
        </div>
        ${state.adminTab==='products' ? renderAdminProducts() : ''}
        ${state.adminTab==='orders' ? renderAdminOrders() : ''}
        ${state.adminTab==='settings' ? renderAdminSettings() : ''}
      </div>
    `;
  }

  function updateAdminLivePreview(draft){
    const stage = document.getElementById('adminPreviewStage');
    if(!stage) return;
    const image = (draft.image||'').trim();
    stage.style.setProperty('--preview-image', image ? `url(\"${image.replace(/\"/g,'')}\")` : 'none');
    const name = document.getElementById('adminPreviewName');
    const dims = document.getElementById('adminPreviewDims');
    if(name) name.textContent = draft.name || (state.lang==='ar'?'اسم المجسم':'Your figure name');
    if(dims) dims.textContent = `${draft.width||'—'} × ${draft.depth||'—'} × ${draft.height||'—'} cm`;
  }

  function renderAdminProducts(){
    const ep = state.editingProduct;
    const draftKey = ep ? String(ep.id) : 'new';
    let vals;
    if(state.productFormDraft && state.productFormDraft._key === draftKey){
      vals = state.productFormDraft;
    } else {
      vals = {
        name: ep?.name || '', price: ep?.price ?? '', image: ep?.image || '',
        images: ep?.images || '', description: ep?.description || '', badge: ep?.badge || '',
        rating: ep?.rating ?? '', reviews_count: ep?.reviews_count ?? '',
        width: ep?.width ?? '', height: ep?.height ?? '', depth: ep?.depth ?? '', model_url: ep?.model_url ?? '',
      };
      state.productFormDraft = { _key: draftKey, ...vals };
    }
    return `
      <div class="panel" id="product-form" style="margin-bottom:24px;">
        <h3>${ep ? esc(t('editProductTitle')) : esc(t('addProductTitle'))}</h3>
        <div class="muted-note">${esc(t('ratingColumnsNote'))}</div>
        <form onsubmit="__actions.saveProduct(event)" oninput="__actions.updateProductDraft(this)">
          <div class="form-grid">
            <div class="field"><label>${esc(t('fieldProductName'))}</label><input name="name" required value="${esc(vals.name)}"></div>
            <div class="field"><label>${esc(t('fieldPrice'))}</label><input name="price" type="number" step="0.01" min="0" required value="${esc(String(vals.price ?? ''))}"></div>
            <div class="field full"><label>${esc(t('fieldMainImage'))}</label><input name="image" type="url" placeholder="https://..." value="${esc(vals.image)}"></div>
            <div class="field full"><label>${state.lang==='ar'?'رابط موديل 3D (GLB / GLTF)':'3D model URL (GLB / GLTF)'}</label><input name="model_url" type="url" placeholder="https://.../figure.glb" value="${esc(vals.model_url||'')}"><small class="field-help">${state.lang==='ar'?'ارفع الملف على استضافة تدعم CORS ثم ضع الرابط هنا.':'Host the file with CORS enabled, then paste the public URL here.'}</small></div>
            <div class="field full"><label>${esc(t('fieldGallery'))}</label><input name="images" placeholder="https://..., https://..." value="${esc(vals.images)}"></div>
            <div class="field full"><label>${esc(t('fieldDescription'))}</label><textarea name="description" rows="2">${esc(vals.description)}</textarea></div>
            <div class="field"><label>${esc(t('fieldBadge'))}</label><input name="badge" value="${esc(vals.badge)}"></div>
            <div class="field"><label>${esc(t('fieldRating'))}</label><input name="rating" type="number" min="0" max="5" step="0.1" placeholder="4.5" value="${esc(String(vals.rating ?? ''))}"></div>
            <div class="field"><label>${esc(t('fieldReviewsCount'))}</label><input name="reviews_count" type="number" min="0" step="1" placeholder="12" value="${esc(String(vals.reviews_count ?? ''))}"></div>
            <div class="field dimension-field"><label>${state.lang==='ar'?'العرض (سم)':'Width (cm)'}</label><input name="width" type="number" min="1" step="0.1" value="${esc(String(vals.width ?? ''))}"></div>
            <div class="field dimension-field"><label>${state.lang==='ar'?'الارتفاع (سم)':'Height (cm)'}</label><input name="height" type="number" min="1" step="0.1" value="${esc(String(vals.height ?? ''))}"></div>
            <div class="field dimension-field"><label>${state.lang==='ar'?'العمق (سم)':'Depth (cm)'}</label><input name="depth" type="number" min="1" step="0.1" value="${esc(String(vals.depth ?? ''))}"></div>
            <div class="field full dimension-help"><small class="field-help">${state.lang==='ar'?'لن يظهر قسم 3D إلا بعد إدخال العرض والارتفاع والعمق ورابط الموديل معًا.':'The 3D section appears only when width, height, depth, and a model URL are all provided.'}</small></div>
          </div>
          <div class="admin-preview"><div><span class="eyebrow">${state.lang==='ar'?'معاينة مباشرة':'Live preview'}</span><h4 id="adminPreviewName">${esc(vals.name || (state.lang==='ar'?'اسم المجسم':'Your figure name'))}</h4><p id="adminPreviewDims">${vals.width||'—'} × ${vals.depth||'—'} × ${vals.height||'—'} cm</p></div><div class="admin-preview-stage" id="adminPreviewStage" style="--preview-image:${vals.image?`url('\${esc(vals.image)}\')`:'none'}"><div class="admin-preview-shape"></div></div></div>
          <button type="submit" class="save-btn">${ep ? esc(t('saveChanges')) : esc(t('addProductBtn'))}</button>
          ${ep ? `<button type="button" class="mini-btn" style="margin-inline-start:10px;" onclick="__actions.cancelEdit()">${esc(t('cancel'))}</button>` : ''}
        </form>
      </div>
      <div class="panel">
        <h3>${esc(t('currentProducts'))} (${state.products.length})</h3>
        ${state.products.length===0 ? `<p style="color:var(--ink-soft);">${esc(t('noProductsAdmin'))}</p>` : state.products.map(p=>`
          <div class="admin-product-row">
            ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>'+window.__actions._placeholderSvg()+'</div>'">` : `<div class="ph">${printPlaceholderIcon()}</div>`}
            <div class="info">
              <div class="n">${esc(p.name)}</div>
              <div class="p">${money(p.price)}</div>
            </div>
            <div class="row-actions">
              <button class="mini-btn" type="button" onclick="__actions.editProduct('${p.id}')">${esc(t('edit'))}</button>
              <button class="mini-btn danger" type="button" onclick="__actions.deleteProduct('${p.id}')">${esc(t('delete'))}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminOrders(){
    return `
      <div class="panel">
        <h3>${esc(t('ordersTitle'))}</h3>
        ${state.orders.length===0 ? `<p style="color:var(--ink-soft);">${esc(t('noOrders'))}</p>` : state.orders.map(o=>`
          <div class="order-card">
            <div class="top"><span>${esc(o.customer_name)}</span><span class="amt mono">${money(o.total)}</span></div>
            <div class="meta">
              ${esc(o.phone)}<br>
              ${esc(o.address)}<br>
              ${o.note ? `${esc(o.note)}<br>` : ''}
              ${new Date(o.created_at).toLocaleString('en-US')}
            </div>
            <ul>${o.items.map(it=>`<li>${esc(it.name)} × ${it.qty} — ${money(it.price*it.qty)}</li>`).join('')}</ul>
            <button class="mini-btn danger" type="button" style="margin-top:10px;" onclick="__actions.cancelOrder('${o.id}')">${esc(t('cancelOrder'))}</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminSettings(){
    const s = state.settings;
    return `
      <div class="panel">
        <h3>${esc(t('storeSettingsTitle'))}</h3>
        <div class="muted-note">${esc(t('settingsNote'))}</div>
        <form onsubmit="__actions.saveSettings(event)">
          <div class="field"><label>${esc(t('fieldStoreName'))}</label><input name="sname" required value="${esc(s.name)}"></div>
          <div class="field"><label>${esc(t('fieldTagline'))}</label><textarea name="tagline" rows="2">${esc(s.tagline)}</textarea></div>
          <button type="submit" class="save-btn">${esc(t('save'))}</button>
        </form>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(state.loading){
      app.innerHTML = `<div class="loading-box mono">${esc(t('loading'))}</div>`;
      return;
    }
    if(state.view === 'admin'){ app.innerHTML = renderAdmin(); }
    else if(state.view === 'product'){ app.innerHTML = renderProduct(); }
    else { app.innerHTML = renderStore(); }
    queueMicrotask(()=>window.initThreeViewer?.());
  }

  // ---------- gallery keyboard + swipe (registered once, delegated) ----------
  document.addEventListener('keydown', (e) => {
    if(state.view !== 'product') return;
    if(e.key === 'ArrowLeft') A.pdPrev();
    if(e.key === 'ArrowRight') A.pdNext();
  });

  let pdTouchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    if(state.view !== 'product') return;
    if(!e.target.closest('#pdMainWrap')) return;
    pdTouchStartX = e.touches[0].clientX;
  }, { passive:true });
  document.addEventListener('touchend', (e) => {
    if(state.view !== 'product') return;
    if(!e.target.closest('#pdMainWrap')) return;
    const dx = e.changedTouches[0].clientX - pdTouchStartX;
    if(Math.abs(dx) > 40){ dx > 0 ? A.pdPrev() : A.pdNext(); }
  }, { passive:true });

  // ---------- back-to-top visibility ----------
  let backToTopFrame = 0;
  document.addEventListener('scroll', () => {
    if(backToTopFrame) return;
    backToTopFrame = requestAnimationFrame(() => {
      backToTopFrame = 0;
      const btn = document.getElementById('backToTop');
      if(btn) btn.classList.toggle('show', window.scrollY > 600);
    });
  }, { passive:true });

  // ---------- smooth hero smoke + scene parallax ----------
  let heroPointerFrame = 0;
  let heroPointerX = 50;
  let heroPointerY = 50;
  document.addEventListener('mousemove', (e) => {
    if(heroPointerFrame) return;
    heroPointerFrame = requestAnimationFrame(() => {
      heroPointerFrame = 0;
      const hero = document.querySelector('.hero');
      const smoke = document.querySelector('.hero-smoke');
      if(hero){
        const rect = hero.getBoundingClientRect();
        const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
        heroPointerX += (x - heroPointerX) * .22;
        heroPointerY += (y - heroPointerY) * .22;
        if(smoke){
          smoke.style.setProperty('--smoke-x', ((heroPointerX - 50) * .24).toFixed(2) + 'px');
          smoke.style.setProperty('--smoke-y', ((heroPointerY - 50) * .16).toFixed(2) + 'px');
        }
      }

      const scene = document.querySelector('.hero-scene svg');
      if(!scene) return;
      const rect = scene.parentElement.getBoundingClientRect();
      if(e.clientX < rect.left - 60 || e.clientX > rect.right + 60 || e.clientY < rect.top - 60 || e.clientY > rect.bottom + 60) return;
      const px = (e.clientX - (rect.left + rect.width/2)) / rect.width;
      const py = (e.clientY - (rect.top + rect.height/2)) / rect.height;
      scene.style.transform = `rotateY(${px*10}deg) rotateX(${-py*10}deg)`;
    });
  });
  document.addEventListener('mouseleave', () => {
    const scene = document.querySelector('.hero-scene svg');
    const smoke = document.querySelector('.hero-smoke');
    if(scene) scene.style.transform = 'rotateY(0deg) rotateX(0deg)';
    if(smoke){
      smoke.style.setProperty('--smoke-x','0px');
      smoke.style.setProperty('--smoke-y','0px');
    }
  });

  // Interactive 3D dimensions viewer: pointer drag + wheel zoom, no external library required.
  let viewerDrag = null;
  document.addEventListener('pointerdown', e=>{ const v=e.target.closest('#dimensionViewer'); if(!v) return; viewerDrag={v,x:e.clientX,y:e.clientY,rx:parseFloat(v.style.getPropertyValue('--rx'))||-7,ry:parseFloat(v.style.getPropertyValue('--ry'))||18}; v.setPointerCapture?.(e.pointerId); });
  document.addEventListener('pointermove', e=>{ if(!viewerDrag) return; const d=viewerDrag; d.ry += (e.clientX-d.x)*.55; d.rx -= (e.clientY-d.y)*.35; d.rx=Math.max(-35,Math.min(35,d.rx)); d.v.style.setProperty('--rx',d.rx+'deg'); d.v.style.setProperty('--ry',d.ry+'deg'); d.x=e.clientX; d.y=e.clientY; });
  document.addEventListener('pointerup',()=>{ viewerDrag=null; });
  document.addEventListener('wheel',e=>{ const v=e.target.closest('#dimensionViewer'); if(!v) return; e.preventDefault(); const z=parseFloat(v.dataset.zoom||'1'); v.dataset.zoom=Math.max(.72,Math.min(1.45,z+(e.deltaY<0?.07:-.07))); v.style.setProperty('--zoom',v.dataset.zoom); },{passive:false});

  loadAll();
})();
</script>

<script type="module">
  import * as THREE from 'https://esm.sh/three@0.160.0';
  import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
  import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

  const viewerStates = new WeakMap();
  const loader = new GLTFLoader();
  function disposeViewer(root){
    const old=viewerStates.get(root); if(!old) return;
    old.active=false; old.ro?.disconnect(); old.resizeRo?.disconnect(); old.controls?.dispose(); old.renderer?.dispose();
    old.canvas?.remove(); viewerStates.delete(root);
  }
  function fitModel(model, camera){
    const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
    model.position.sub(center); model.position.y -= size.y*.03;
    const max=Math.max(size.x,size.y,size.z)||1, distance=max*2.7;
    camera.position.set(distance*.85,distance*.55,distance*1.15); camera.near=max/100; camera.far=max*20; camera.updateProjectionMatrix();
  }
  function createViewer(root){
    if(!root) return;
    disposeViewer(root);
    const url=root.dataset.model?.trim(), host=root.querySelector('#threeViewerCanvas');
    if(!url || !host) return;
    const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setClearColor(0,0); renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.domElement.className='three-canvas'; host.appendChild(renderer.domElement);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(34,1,.01,100);
    scene.add(new THREE.HemisphereLight(0xffffff,0x202421,2.2));
    const key=new THREE.DirectionalLight(0xffffff,2.8); key.position.set(3,5,4); scene.add(key);
    const rim=new THREE.DirectionalLight(0xe5483f,1.2); rim.position.set(-4,2,-3); scene.add(rim);
    const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.07; controls.enablePan=false; controls.minDistance=.4; controls.maxDistance=8; controls.target.set(0,0,0);
    const state={active:true,renderer,camera,controls,canvas:renderer.domElement,model:null,ro:null,resizeRo:null,visible:true}; viewerStates.set(root,state);
    const resize=()=>{const r=host.getBoundingClientRect(); if(!r.width||!r.height)return; renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix();};
    state.resizeRo=new ResizeObserver(resize); state.resizeRo.observe(host); resize();
    const showFallback=()=>{host.classList.remove('is-ready'); root.classList.add('three-fallback');};
    loader.load(url,gltf=>{if(!state.active)return; state.model=gltf.scene; state.model.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}}); fitModel(state.model,camera); scene.add(state.model); root.classList.add('three-ready'); root.classList.remove('three-fallback');},undefined,showFallback);
    const observer=new IntersectionObserver(entries=>{state.visible=entries[0]?.isIntersecting!==false;},{threshold:.05}); observer.observe(root); state.ro=observer;
    const tick=()=>{if(!state.active)return; if(state.visible){controls.update(); renderer.render(scene,camera);} requestAnimationFrame(tick);}; requestAnimationFrame(tick);
  }
  window.initThreeViewer=()=>{const root=document.getElementById('dimensionViewer'); if(root?.dataset.model) createViewer(root);};
  window.addEventListener('load',()=>setTimeout(()=>window.initThreeViewer?.(),0),{once:true});
</script>
