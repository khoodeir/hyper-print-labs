<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Print Labs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

  :root{
    /* ---- Workshop / additive-manufacturing token system ---- */
    --graphite:#1B1A17;        /* warm near-black — workshop at night */
    --graphite-2:#262420;      /* raised panel on dark */
    --graphite-3:#332F28;
    --paper:#F2EEE3;           /* warm concrete paper — main light bg */
    --paper-soft:#E7E0CE;
    --ink:#1B1A17;
    --ink-soft:#6E6656;
    --ember:#FF5A22;           /* heated nozzle / filament orange — signature accent */
    --ember-deep:#C7420E;
    --ember-dark:#7A2A0B;
    --signal:#2FB8A0;          /* status-LED teal — secondary accent (ready/done) */
    --signal-deep:#187363;
    --line:#DCD4BE;
    --line-dark:rgba(242,238,227,0.14);
    --radius:10px;
    --radius-lg:20px;
    --shadow:0 18px 42px rgba(27,26,23,0.20);
    --shadow-soft:0 3px 12px rgba(27,26,23,0.12);
    --font-display:'Big Shoulders Display',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  html[lang="ar"]{
    --font-display:'Cairo',sans-serif;
    --font-body:'IBM Plex Sans Arabic',sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:-0.2px;
  }
  html:not([lang="ar"]) h1,html:not([lang="ar"]) h2,html:not([lang="ar"]) h3,html:not([lang="ar"]) .display{
    text-transform:uppercase;letter-spacing:0.2px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--ember-deep);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .mono{font-family:var(--font-mono);}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:var(--graphite);
    border-bottom:1px solid var(--line-dark);
    padding:13px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:38px;height:38px;flex-shrink:0;}
  .brand-name{font-size:19px;color:var(--paper);font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  html[lang="ar"] .brand-name{text-transform:none;letter-spacing:0;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    position:relative;
    width:40px;height:40px;border-radius:8px;
    background:var(--graphite-2);border:1px solid var(--line-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--paper);transition:transform .15s ease,border-color .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);border-color:var(--ember);}
  .lang-btn{
    width:auto;padding:0 13px;border-radius:8px;font-size:12px;font-weight:700;color:var(--paper);
    font-family:var(--font-mono);letter-spacing:.6px;
  }
  .cart-count{
    position:absolute;inset-block-start:-5px;inset-inline-end:-5px;
    background:var(--ember);color:#1B1A17;
    font-family:var(--font-mono);
    font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .cart-count.pulse{animation:pulse .4s ease;}
  @keyframes pulse{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .admin-link{
    font-size:12.5px;font-family:var(--font-mono);color:var(--paper);
    display:flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:8px;background:var(--graphite-2);border:1px solid var(--line-dark);
    transition:transform .15s ease,border-color .15s ease;
  }
  .admin-link:hover{transform:translateY(-2px);border-color:var(--ember);}

  /* ---------- Hero (build-plate scene) ---------- */
  .hero{
    position:relative;
    background:var(--graphite);
    color:var(--paper);
    padding:80px 24px 0;
    overflow:hidden;
  }
  .hero-texture{
    position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(var(--line-dark) 1px,transparent 1px),
      linear-gradient(90deg,var(--line-dark) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 20%,black 0%,transparent 78%);
    mask-image:radial-gradient(ellipse 75% 65% at 50% 20%,black 0%,transparent 78%);
  }
  .hero-inner{
    position:relative;max-width:1180px;margin:0 auto;
    display:flex;align-items:center;gap:48px;flex-wrap:wrap;
    padding-bottom:0;
  }
  .hero-copy{flex:1 1 380px;max-width:520px;}
  .hero-eyebrow{
    font-family:var(--font-mono);font-size:12.5px;color:var(--ember);
    display:flex;align-items:center;gap:8px;margin-bottom:16px;letter-spacing:.4px;
  }
  .hero-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(255,90,34,0.18);flex-shrink:0;}
  .hero h1{font-size:clamp(34px,5vw,54px);margin:0 0 16px;line-height:1.05;color:var(--paper);}
  .hero p{font-size:16.5px;color:#B9B0A0;margin:0 0 30px;max-width:440px;line-height:1.7;}
  .cta-btn{
    display:inline-flex;align-items:center;gap:10px;background:var(--ember);color:#241300;
    font-weight:700;font-family:var(--font-body);
    padding:14px 26px;border-radius:8px;font-size:15px;
    box-shadow:0 12px 26px rgba(255,90,34,0.28);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(255,90,34,0.38);background:#FF6E3B;}
  .cta-btn svg{width:16px;height:16px;flex-shrink:0;}
  html[dir="rtl"] .cta-btn svg{transform:scaleX(-1);}

  .hero-scene{flex:1 1 320px;max-width:400px;display:flex;justify-content:center;perspective:900px;}
  .hero-scene svg{width:100%;height:auto;max-width:340px;transition:transform .25s ease-out;transform-style:preserve-3d;}

  /* ---- Live-printing loop: the hero build never finishes printing ---- */
  .live-head{
    animation:heroHeadSweep 3.4s cubic-bezier(.45,.02,.55,.98) infinite;
    transform-box:fill-box;transform-origin:center;
    filter:drop-shadow(0 0 7px rgba(255,90,34,.55));
  }
  @keyframes heroHeadSweep{
    0%{transform:translateX(-58px);}
    50%{transform:translateX(58px);}
    100%{transform:translateX(-58px);}
  }
  .live-layer-glow{
    animation:heroLayerGlow 3.4s ease-in-out infinite;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes heroLayerGlow{
    0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(255,90,34,0));}
    50%{opacity:.62;filter:drop-shadow(0 0 5px rgba(255,90,34,.6));}
  }
  .live-spark{
    animation:heroSparkDrift 3.4s ease-in-out infinite;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes heroSparkDrift{
    0%{transform:translate(-58px,0);opacity:0;}
    8%{opacity:1;}
    50%{transform:translate(58px,-2px);opacity:.9;}
    92%{opacity:1;}
    100%{transform:translate(-58px,0);opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .live-head,.live-layer-glow,.live-spark{animation:none;filter:none;opacity:1;transform:none;}
  }

  .hero-animate .hero-eyebrow,.hero-animate h1,.hero-animate p,.hero-animate .cta-btn{animation:heroFadeUp .7s ease both;}
  .hero-animate .hero-eyebrow{animation-delay:.06s;}
  .hero-animate h1{animation-delay:.14s;}
  .hero-animate p{animation-delay:.24s;}
  .hero-animate .cta-btn{animation-delay:.34s;}
  .hero-animate .hero-scene{animation:heroFadeUp .8s ease both .3s;}
  @keyframes heroFadeUp{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){
    .hero-animate .hero-eyebrow,.hero-animate h1,.hero-animate p,.hero-animate .cta-btn,.hero-animate .hero-scene{animation:none;opacity:1;transform:none;}
  }

  /* Calibration-ruler seam between hero and the store interior */
  .hero-seam{
    position:relative;height:26px;margin-top:44px;background:var(--graphite);
    background-image:repeating-linear-gradient(90deg,var(--ember) 0 2px,transparent 2px 18px);
    background-position:0 6px;
    -webkit-mask-image:linear-gradient(to bottom,black 0%,black 35%,transparent 100%);
    mask-image:linear-gradient(to bottom,black 0%,black 35%,transparent 100%);
  }

  /* ---------- Products ---------- */
  main{max-width:1180px;margin:0 auto;padding:52px 24px 90px;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .section-head .eyebrow{
    color:var(--ember-deep);font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;
    font-family:var(--font-mono);display:block;margin-bottom:6px;
  }
  html[lang="ar"] .section-head .eyebrow{text-transform:none;}
  .section-head h2{font-size:27px;margin:0;color:var(--ink);}
  .section-count{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);}

  .empty-state{
    text-align:center;padding:60px 20px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius-lg);
    max-width:520px;margin:0 auto;
  }
  .empty-state svg{width:74px;height:74px;margin:0 auto 16px;display:block;}
  .empty-state h3{margin:0 0 8px;font-size:20px;}
  .empty-state p{color:var(--ink-soft);margin:0 0 22px;line-height:1.7;font-size:14px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;
  }
  .product-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-soft);display:flex;flex-direction:column;
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;position:relative;cursor:pointer;
  }
  .product-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--ember);}
  .product-media{
    aspect-ratio:1/1;background:var(--graphite);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  }
  .product-media img{width:100%;height:100%;object-fit:cover;}
  .product-media .placeholder-svg{width:56%;height:56%;opacity:.9;}
  .badge{
    position:absolute;inset-block-start:12px;inset-inline-end:12px;background:var(--ember);
    color:#241300;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.2px;
    font-family:var(--font-mono);
  }
  .product-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .product-body h3{font-size:16.5px;margin:0;font-weight:700;font-family:var(--font-body);text-transform:none;letter-spacing:0;}
  .product-desc{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .price{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--ember-deep);}
  .add-btn{
    background:var(--ink);color:#fff;padding:9px 15px;border-radius:8px;font-size:12.5px;font-weight:700;
    transition:background .15s ease;
  }
  .add-btn:hover{background:var(--ember-deep);}

  /* ---------- Product detail page ---------- */
  .pd-wrap{max-width:1100px;margin:0 auto;padding:32px 24px 90px;}
  .pd-back{
    display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;
    color:var(--ink-soft);margin-bottom:22px;font-family:var(--font-mono);
  }
  .pd-back:hover{color:var(--ink);}
  .pd-grid{display:flex;gap:48px;flex-wrap:wrap;}
  .pd-gallery{flex:1 1 420px;max-width:560px;}
  .pd-main-wrap{
    position:relative;background:var(--graphite);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:1/1;touch-action:pan-y;user-select:none;
  }
  .pd-main{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .pd-main img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .pd-main .placeholder-svg{width:46%;height:46%;pointer-events:none;}
  .pd-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:8px;background:rgba(27,26,23,.75);border:1px solid var(--line-dark);
    color:var(--paper);
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,transform .15s ease;z-index:2;
  }
  .pd-nav:hover{background:var(--ember-deep);transform:translateY(-50%) scale(1.06);}
  .pd-nav-prev{left:14px;}
  .pd-nav-next{right:14px;}
  .pd-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
  .pd-dot{width:7px;height:7px;border-radius:50%;background:rgba(242,238,227,.3);cursor:pointer;transition:background .15s ease,width .15s ease;}
  .pd-dot.active{background:var(--ember);width:18px;border-radius:4px;}
  .pd-thumbs{display:flex;gap:10px;margin-top:14px;}
  .pd-thumb{
    width:64px;height:64px;border-radius:10px;overflow:hidden;cursor:pointer;
    border:2px solid var(--line);opacity:.6;transition:opacity .15s ease,border-color .15s ease;
    flex-shrink:0;background:var(--graphite);
    display:flex;align-items:center;justify-content:center;
  }
  .pd-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pd-thumb.active{opacity:1;border-color:var(--ember);}
  .pd-thumb:hover{opacity:1;}
  .pd-info{flex:1 1 360px;max-width:480px;padding-top:4px;}
  .pd-title{font-size:30px;font-weight:700;margin:0 0 8px;line-height:1.15;color:var(--ink);font-family:var(--font-body);text-transform:none;}
  .pd-price{font-size:23px;font-weight:700;margin-bottom:18px;color:var(--ember-deep);font-family:var(--font-mono);}
  .pd-desc{font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:26px;}
  .pd-qty-row{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
  .pd-qty-btn{
    width:36px;height:36px;border-radius:8px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:18px;
    transition:background .15s ease,transform .1s ease;
  }
  .pd-qty-btn:hover{background:var(--paper-soft);}
  .pd-qty-btn:active{transform:scale(.92);}
  .pd-qty-value{font-size:16px;min-width:18px;text-align:center;color:var(--ink);font-family:var(--font-mono);}
  .pd-add-btn{
    width:100%;padding:17px;border-radius:8px;background:var(--ink);color:#fff;
    font-size:15px;font-weight:700;
    transition:transform .12s ease,background .2s ease;
  }
  .pd-add-btn:hover{transform:translateY(-1px);background:var(--ember-deep);}
  .pd-add-btn:active{transform:translateY(0) scale(.985);}
  .pd-add-btn.added{background:var(--signal-deep);}

  .flying-item{
    position:fixed;border-radius:10px;pointer-events:none;z-index:999;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:left .7s cubic-bezier(.3,0,.2,1),top .7s cubic-bezier(.3,0,.2,1),right .7s cubic-bezier(.3,0,.2,1),
      width .7s cubic-bezier(.3,0,.2,1),height .7s cubic-bezier(.3,0,.2,1),opacity .7s ease-in;
  }
  .flying-item img{width:100%;height:100%;object-fit:cover;}

  /* ---------- Cart drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(19,17,14,0.5);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(380px,92vw);
    background:#fff;z-index:51;transform:translateX(100%);
    transition:transform .3s cubic-bezier(.25,.1,.2,1);display:flex;flex-direction:column;
    box-shadow:-14px 0 36px rgba(0,0,0,0.25);
  }
  html[dir="rtl"] .drawer{ transform:translateX(-100%); box-shadow:14px 0 36px rgba(0,0,0,0.25); }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px;background:var(--graphite);border-bottom:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{margin:0;font-size:17px;font-family:var(--font-mono);color:var(--paper);text-transform:uppercase;letter-spacing:.3px;}
  html[lang="ar"] .drawer-head h3{text-transform:none;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #EEEEEE;}
  .cart-item img,.cart-item .ph{width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--graphite);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-item .ph svg{width:60%;height:60%;}
  .cart-item-info{flex:1;display:flex;flex-direction:column;gap:4px;}
  .cart-item-info .name{font-weight:700;font-size:14px;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:26px;height:26px;border-radius:6px;background:var(--paper-soft);border:1px solid var(--line);font-weight:700;transition:background .15s ease;}
  .qty-btn:hover{background:#DCD2B6;}
  .remove-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;margin-inline-start:auto;}
  .drawer-foot{padding:18px 20px;border-top:1px solid #EAEAEA;}
  .total-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-weight:700;font-size:18px;margin-bottom:14px;}
  .checkout-btn{
    width:100%;background:var(--ember);
    color:#241300;padding:14px;border-radius:8px;font-weight:700;font-size:15px;
    transition:transform .15s ease,background .15s ease;
  }
  .checkout-btn:hover:not(:disabled){transform:translateY(-1px);background:#FF6E3B;}
  .close-x{font-size:20px;color:var(--paper);}

  /* ---------- Checkout form ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink-soft);font-family:var(--font-mono);}
  html[lang="ar"] .field label{font-family:var(--font-body);}
  .field input,.field textarea{
    width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
    font-size:14px;transition:border-color .15s ease;
  }
  .field input:focus,.field textarea:focus{border-color:var(--ember-deep);outline:none;}

  .success-box{text-align:center;padding:20px 6px;}
  .success-box svg{width:56px;height:56px;margin:0 auto 12px;display:block;}

  /* ---------- Admin ---------- */
  .admin-wrap{max-width:900px;margin:0 auto;padding:40px 20px 90px;}
  .admin-gate{max-width:360px;margin:80px auto;background:#fff;padding:36px;border-radius:var(--radius-lg);box-shadow:var(--shadow);text-align:center;}
  .admin-gate svg{width:44px;height:44px;margin:0 auto 8px;}
  .tabs{display:flex;gap:4px;margin-bottom:26px;background:#fff;padding:5px;border-radius:10px;box-shadow:var(--shadow-soft);width:fit-content;border:1px solid var(--line);}
  .tab-btn{padding:9px 18px;border-radius:7px;font-weight:700;font-size:13.5px;color:var(--ink-soft);transition:background .15s ease,color .15s ease;font-family:var(--font-mono);}
  html[lang="ar"] .tab-btn{font-family:var(--font-body);}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .panel{background:#fff;border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .panel h3{margin-top:0;font-family:var(--font-body);text-transform:none;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
  .save-btn{
    background:var(--ember-deep);color:#fff;padding:12px 26px;border-radius:8px;font-weight:700;margin-top:6px;
    transition:transform .15s ease,background .15s ease;
  }
  .save-btn:hover{transform:translateY(-1px);background:var(--ember);color:#241300;}
  .admin-product-row{
    display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #EEEEEE;
  }
  .admin-product-row img,.admin-product-row .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--graphite);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .admin-product-row .ph svg{width:60%;height:60%;}
  .admin-product-row .info{flex:1;}
  .admin-product-row .info .n{font-weight:700;font-size:14px;}
  .admin-product-row .info .p{font-size:13px;color:var(--ink-soft);font-family:var(--font-mono);}
  .row-actions{display:flex;gap:8px;}
  .mini-btn{background:var(--paper-soft);padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;transition:background .15s ease;}
  .mini-btn:hover{background:#DCD2B6;}
  .mini-btn.danger{color:var(--ember-deep);}
  .order-card{border:1px solid #EEEEEE;border-radius:14px;padding:16px;margin-bottom:14px;transition:box-shadow .15s ease;}
  .order-card:hover{box-shadow:var(--shadow-soft);}
  .order-card .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;}
  .order-card .top .amt{font-family:var(--font-mono);color:var(--ember-deep);}
  .order-card .meta{font-size:13px;color:var(--ink-soft);margin-bottom:8px;line-height:1.7;}
  .order-card ul{margin:0;padding-inline-start:18px;font-size:13px;}
  .muted-note{font-size:12px;color:var(--ink-soft);background:var(--paper-soft);border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:18px;line-height:1.7;}

    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--graphite);color:var(--paper);padding:12px 22px;border-radius:8px;font-size:13.5px;
    z-index:80;transition:transform .25s ease;box-shadow:0 8px 20px rgba(0,0,0,0.3);
    font-family:var(--font-mono);
  }
  html[lang="ar"] .toast{font-family:var(--font-body);}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .loading-box{text-align:center;padding:100px 20px;color:var(--ink-soft);}
  footer{max-width:1180px;margin:0 auto;text-align:center;padding:30px 24px;color:var(--ink-soft);font-size:12.5px;border-top:1px solid var(--line);}

  /* ---------- Intro: build-plate reveal ---------- */
  .intro-overlay{
    position:fixed;inset:0;z-index:999;
    background:var(--graphite);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .6s ease,visibility .6s ease;
  }
  .intro-overlay.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-scene{position:relative;width:min(260px,70vw);display:flex;flex-direction:column;align-items:center;}

  .intro-rig{width:100%;overflow:visible;}
  .intro-head{
    animation:railSweep 1.7s cubic-bezier(.45,.02,.55,.98) infinite;
    transform-box:fill-box;transform-origin:center;
  }
  @keyframes railSweep{
    0%{transform:translateX(-72px);}
    50%{transform:translateX(72px);}
    100%{transform:translateX(-72px);}
  }
  .intro-layers rect{
    animation:layerRise 2.3s cubic-bezier(.2,.7,.3,1) both;
    transform-box:fill-box;transform-origin:bottom;
  }
  .intro-layers rect:nth-child(1){animation-delay:.05s;}
  .intro-layers rect:nth-child(2){animation-delay:.22s;}
  .intro-layers rect:nth-child(3){animation-delay:.39s;}
  .intro-layers rect:nth-child(4){animation-delay:.56s;}
  .intro-layers rect:nth-child(5){animation-delay:.73s;}
  .intro-layers rect:nth-child(6){animation-delay:.90s;}
  .intro-layers rect:nth-child(7){animation-delay:1.07s;}
  @keyframes layerRise{
    0%{transform:scaleY(0);opacity:0;}
    45%{opacity:1;}
    100%{transform:scaleY(1);opacity:1;}
  }

  .intro-readout{
    margin-top:16px;display:flex;align-items:baseline;gap:10px;font-family:var(--font-mono);
  }
  .intro-percent{font-size:30px;font-weight:700;color:var(--ember);min-width:74px;text-align:end;font-variant-numeric:tabular-nums;}
  .intro-percent::after{content:'%';font-size:16px;color:#8B8474;margin-inline-start:2px;}
  .intro-layer-count{font-size:11.5px;color:#8B8474;}

  .intro-result{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .intro-name{
    font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--paper);
    text-align:center;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:clip;
    clip-path:inset(0 100% 0 0);text-transform:uppercase;letter-spacing:.4px;
    animation:wipeReveal 1.0s cubic-bezier(.65,0,.35,1) forwards 1.55s;
  }
  html[lang="ar"] .intro-name{text-transform:none;letter-spacing:0;}
  html[dir="rtl"] .intro-name{ clip-path:inset(0 0 0 100%); animation-name:wipeRevealRtl; }
  @keyframes wipeReveal{ to{ clip-path:inset(0 0 0 0); } }
  @keyframes wipeRevealRtl{ to{ clip-path:inset(0 0 0 0); } }
  .intro-underline{
    width:0;height:2px;background:var(--ember);
    animation:underlineDraw .4s ease forwards 2.45s;
  }
  @keyframes underlineDraw{ to{ width:64px; } }

  .intro-caption{font-size:12px;color:#8B8474;letter-spacing:.3px;font-family:var(--font-mono);margin-top:2px;}
  html[lang="ar"] .intro-caption{font-family:var(--font-body);}

  @media (prefers-reduced-motion:reduce){
    .intro-head{animation:none;}
    .intro-layers rect{animation:none;transform:none;opacity:1;}
    .intro-name{animation:none;clip-path:inset(0 0 0 0);}
    .intro-underline{animation:none;width:64px;}
  }

  @media(max-width:640px){
    .pd-title{font-size:25px;}
    .pd-grid{gap:28px;}
    .hero{padding-top:64px;}
  }

    const { data, error } = await supabase.from('orders').select('*').order('created_at',{ascending:false});
    if(!error && data) state.orders = data;
  }
  async function refreshSettings(){
    const { data, error } = await supabase.from('store_settings').select('*').eq('id',1).single();
    if(!error && data){
      state.settings = { name: data.name, tagline: data.tagline };
      const introNameEl = document.getElementById('introStoreName');
      if(introNameEl) introNameEl.textContent = (data.name || 'Store').replace(/[✨◆]/g,'').trim() || 'Store';
    }
  }

  const introStartedAt = Date.now();
  const INTRO_MIN_MS = 2650;
  let introTicker = null;

  function startIntroTicker(){
    const pctEl = document.getElementById('introPercent');
    const layerEl = document.getElementById('introLayerCount');
    const totalLayers = 60;
    const durationMs = 2300;
    const stepMs = 40;
    let elapsed = 0;
    introTicker = setInterval(()=>{
      elapsed += stepMs;
      const frac = Math.min(1, elapsed/durationMs);
      const pct = Math.round(frac*100);
      const layer = Math.round(frac*totalLayers);
      if(pctEl) pctEl.textContent = String(pct);
      if(layerEl) layerEl.textContent = 'layer ' + layer + '/' + totalLayers;
      if(frac>=1 && introTicker){ clearInterval(introTicker); introTicker=null; }
    }, stepMs);
  }
  startIntroTicker();

  function hideIntro(){
    const nameEl = document.getElementById('introStoreName');
    if(nameEl) nameEl.textContent = (state.settings.name || 'Store').replace(/[✨◆]/g,'').trim() || 'Store';
    const elapsed = Date.now() - introStartedAt;
    const wait = Math.max(0, INTRO_MIN_MS - elapsed);
    setTimeout(() => {
      if(introTicker){ clearInterval(introTicker); introTicker=null; }
      const pctEl = document.getElementById('introPercent');
      const layerEl = document.getElementById('introLayerCount');
      if(pctEl) pctEl.textContent = '100';
      if(layerEl) layerEl.textContent = 'layer 60/60';
      const el = document.getElementById('introOverlay');
      if(!el) return;
      el.classList.add('hide');
      setTimeout(() => el.remove(), 650);

      state.loading = false;
      render();
      hideIntro();

      state.loading = false;
      state.loadError = (err && err.message) ? err.message : 'A database connection error occurred';
      render();
      hideIntro();

  function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const p = state.products.find(x=>String(x.id)===String(id));
      return p ? {...p, qty} : null;
    }).filter(Boolean);

  function cartTotal(){ return cartItems().reduce((sum,it)=>sum+it.price*it.qty,0); }

  // ---------- flying "added to cart" animation ----------
  function flyToCart(sourceEl){
    const cartEl = document.getElementById('cartIcon');
    if(!sourceEl || !cartEl) return;
    const srcRect = sourceEl.getBoundingClientRect();
    const cartRect = cartEl.getBoundingClientRect();

    const clone = sourceEl.cloneNode(true);
    clone.classList.add('flying-item');
    clone.style.left = srcRect.left + 'px';
    clone.style.top = srcRect.top + 'px';
    clone.style.width = srcRect.width + 'px';
    clone.style.height = srcRect.height + 'px';
    clone.style.opacity = '1';
    document.body.appendChild(clone);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        clone.style.left = (cartRect.left + cartRect.width/2 - 10) + 'px';
        clone.style.top = (cartRect.top + cartRect.height/2 - 10) + 'px';
        clone.style.width = '20px';
        clone.style.height = '20px';
        clone.style.opacity = '0.15';
      });
    });

    setTimeout(() => {
      clone.remove();
      const freshCart = document.getElementById('cartIcon');
      const freshBadge = document.getElementById('cartCountBadge');
      if(freshCart) freshCart.classList.add('pulse');
      if(freshBadge) freshBadge.classList.add('pulse');
      setTimeout(() => {
        if(freshCart) freshCart.classList.remove('pulse');
        if(freshBadge) freshBadge.classList.remove('pulse');
      }, 400);

  // ---------- actions ----------
  window.__actions = {
    setLang(lang){
      state.lang = lang;
      try{ localStorage.setItem('lang', lang); }catch(e){}
      applyDocumentDir();
      render();
    },
    addToCart(id){
      state.cart[id] = (state.cart[id]||0)+1;
      persistCart();
      showToast(t('added'));
      render();
    },
    addToCartFromCard(ev, id){
      ev.stopPropagation();
      const card = ev.currentTarget.closest('.product-card');
      const media = card ? card.querySelector('.product-media') : null;
      if(media) flyToCart(media);
      this.addToCart(id);
    },
    addToCartFromProduct(id){
      const mainEl = document.getElementById('pdMainImage');
      if(mainEl) flyToCart(mainEl);
      const qty = state.pdQty || 1;
      state.cart[id] = (state.cart[id]||0) + qty;
      persistCart();
      showToast(t('added'));
      const btn = document.getElementById('pdAddBtn');
      if(btn){
        btn.classList.add('added');
        btn.querySelector('span').textContent = '✓';
        setTimeout(()=>{
          btn.classList.remove('added');
          btn.querySelector('span').textContent = t('addToCart');
        }, 1000);
      }
      render();
    },
    changeQty(id, delta){
      const next = (state.cart[id]||0)+delta;
      if(next<=0) delete state.cart[id]; else state.cart[id]=next;
      persistCart();
      render();
    },
    removeFromCart(id){
      delete state.cart[id];
      persistCart();
      render();
    },
    openDrawer(){ state.drawerOpen = true; state.checkoutStep='cart'; render(); },
    closeDrawer(){ state.drawerOpen = false; render(); },
    goToForm(){ if(cartItems().length===0) return; state.checkoutStep='form'; render(); },
    backToCart(){ state.checkoutStep='cart'; render(); },
    async submitOrder(ev){
      ev.preventDefault();
      const f = ev.target;
      const order = {
        customer_name: f.name.value.trim(),
        phone: f.phone.value.trim(),
        address: f.address.value.trim(),
        note: f.note.value.trim(),
        items: cartItems().map(it=>({id:it.id,name:it.name,price:it.price,qty:it.qty})),
        total: cartTotal(),
      };
      const { error } = await supabase.from('orders').insert(order);
      if(error){ showToast(t('toastGenericError')); return; }

      // Fire the order to the n8n webhook (best-effort, never blocks checkout)
      try{
        const webhookRes = await fetch('https://students.milestones-tech.com/webhook-test/kemo', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ ...order, source:'hyper-print-labs', created_at:new Date().toISOString() }),
        });
        if(!webhookRes.ok){
          const bodyText = await webhookRes.text().catch(()=> '');
          console.warn('[webhook] responded with status', webhookRes.status, bodyText);
        } else {
          console.info('[webhook] order delivered successfully');
        }
      }catch(err){
        console.warn('[webhook] delivery failed — the n8n test URL only listens once while "Listen for test event" is open, or check CORS. Error:', err);
      }

      state.cart = {};
      persistCart();
      state.checkoutStep = 'success';
      render();
    },
    goAdmin(){ state.view='admin'; location.hash='admin'; render(); },
    goStore(){ state.view='store'; history.replaceState(null,'',location.pathname+location.search); render(); },
    viewProduct(id){
      state.view = 'product';
      state.selectedProductId = id;
      state.pdQty = 1;
      state.pdGalleryIndex = 0;
      render();
      window.scrollTo(0,0);
    },
    pdPrev(){
      const p = state.products.find(x=>String(x.id)===String(state.selectedProductId));
      const imgs = p ? productImages(p) : [];
      if(imgs.length<2) return;
      state.pdGalleryIndex = (state.pdGalleryIndex - 1 + imgs.length) % imgs.length;
      render();
    },
    pdNext(){
      const p = state.products.find(x=>String(x.id)===String(state.selectedProductId));
      const imgs = p ? productImages(p) : [];
      if(imgs.length<2) return;
      state.pdGalleryIndex = (state.pdGalleryIndex + 1) % imgs.length;
      render();
    },
    pdGoTo(idx){ state.pdGalleryIndex = idx; render(); },
    pdChangeQty(delta){
      state.pdQty = Math.max(1, (state.pdQty||1)+delta);
      render();
    },
    async tryAuth(ev){
      ev.preventDefault();
      const f = ev.target;
      const { error } = await supabase.auth.signInWithPassword({
        email: f.email.value.trim(),
        password: f.password.value,
      });
      if(error){ showToast(t('toastLoginError')); return; }
      await refreshOrders();
      render();
    },
    async signOut(){
      await supabase.auth.signOut();
      state.view = 'store';
      history.replaceState(null,'',location.pathname+location.search);
      render();
    },
    async setAdminTab(tab){
      state.adminTab = tab;
      if(tab==='orders') await refreshOrders();
      render();
    },
    async cancelOrder(id){
      if(!confirm(t('cancelOrderConfirm'))) return;
      const { error } = await supabase.from('orders').delete().eq('id', id);
      if(error){ showToast(t('toastCancelError')); return; }
      await refreshOrders();
      showToast(t('toastOrderCancelled'));
      render();
    },
    editProduct(id){
      state.editingProduct = state.products.find(p=>String(p.id)===String(id)) || null;
      state.adminTab = 'products';
      render();
      document.getElementById('product-form')?.scrollIntoView({behavior:'smooth'});
    },
    updateProductDraft(form){
      const draft = {
        _key: state.editingProduct ? String(state.editingProduct.id) : 'new',
        name: form.name.value,
        price: form.price.value,
        image: form.image.value,
        images: form.images.value,
        description: form.description.value,
        badge: form.badge.value,
      };
      state.productFormDraft = draft;
      try{ localStorage.setItem('productFormDraft', JSON.stringify(draft)); }catch(e){}
    },
    clearProductDraft(){
      state.productFormDraft = null;
      try{ localStorage.removeItem('productFormDraft'); }catch(e){}
    },
    cancelEdit(){
      state.editingProduct = null;
      this.clearProductDraft();
      render();
    },
    async deleteProduct(id){
      if(!confirm(t('deleteConfirm'))) return;
      const { error } = await supabase.from('products').delete().eq('id', id);
      if(error){ showToast(t('toastDeleteError')); return; }
      await refreshProducts();
      showToast(t('toastDeleted'));
      render();
    },
    async saveProduct(ev){
      ev.preventDefault();
      const f = ev.target;
      const data = {
        name: f.name.value.trim(),
        price: parseFloat(f.price.value) || 0,
        image: f.image.value.trim(),
        images: f.images.value.trim(),
        description: f.description.value.trim(),
        badge: f.badge.value.trim(),
      };
      if(!data.name || !data.price){ showToast(t('toastProductRequired')); return; }
      let error;
      if(state.editingProduct){
        ({ error } = await supabase.from('products').update(data).eq('id', state.editingProduct.id));
        if(!error) showToast(t('toastUpdated'));
        state.editingProduct = null;
      } else {
        ({ error } = await supabase.from('products').insert(data));
        if(!error) showToast(t('toastAdded'));
      }
      if(error){ showToast(t('toastGenericError')); return; }
      this.clearProductDraft();
      await refreshProducts();
      f.reset();
      render();
    },
    async saveSettings(ev){
      ev.preventDefault();
      const f = ev.target;
      const data = { name: f.sname.value.trim() || 'Hyper Print Labs', tagline: f.tagline.value.trim() };
      const { error } = await supabase.from('store_settings').update(data).eq('id',1);
      if(error){ showToast(t('toastGenericError')); return; }
      state.settings = data;
      showToast(t('toastSettingsSaved'));
      render();
    },
  };

                <span style="font-size:13px;color:var(--ink-soft);font-family:var(--font-mono);">${money(it.price)}</span>
                <div class="qty-row">
                  <button class="qty-btn" onclick="__actions.changeQty('${it.id}',-1)">−</button>
                  <span>${it.qty}</span>
                  <button class="qty-btn" onclick="__actions.changeQty('${it.id}',1)">+</button>
                  <a href="#" class="remove-link" onclick="__actions.removeFromCart('${it.id}');return false;">${state.lang==='ar'?'حذف':'Remove'}</a>
                </div>
              </div>
            </div>
          `).join('');
    }

    return `
      <div class="overlay ${state.drawerOpen?'open':''}" onclick="__actions.closeDrawer()"></div>
      <aside class="drawer ${state.drawerOpen?'open':''}">
        <div class="drawer-head">
          <h3>${esc(t('cartTitle'))}</h3>
          <button class="close-x" onclick="__actions.closeDrawer()">✕</button>
        </div>
        <div class="drawer-body">${body}</div>
        ${state.checkoutStep==='cart' ? `
          <div class="drawer-foot">
            <div class="total-row"><span>${esc(t('total'))}</span><span>${money(cartTotal())}</span></div>
            <button class="checkout-btn" ${items.length===0?'disabled style="opacity:.5;"':''} onclick="__actions.goToForm()">${esc(t('checkout'))}</button>
          </div>
        ` : ''}
      </aside>
    `;
  }

  function renderAdmin(){
    if(!state.adminAuthed){
      return `
        <header class="topbar">
          <div class="brand">${logoMark()}<div class="brand-name">${esc(t('adminTitle'))}</div></div>
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
        </header>
        <div class="admin-gate">
          ${lockIcon()}
          <h3>${esc(t('adminLoginTitle'))}</h3>
          <p style="color:var(--ink-soft);font-size:13px;">${esc(t('adminLoginDesc'))}</p>
          <form onsubmit="__actions.tryAuth(event)">
            <div class="field"><input name="email" type="email" placeholder="${esc(t('email'))}" required></div>
            <div class="field"><input name="password" type="password" placeholder="${esc(t('password'))}" required></div>
            <button type="submit" class="save-btn" style="width:100%;">${esc(t('logIn'))}</button>
          </form>
        </div>
      `;
    }

    return `
      <header class="topbar">
        <div class="brand">${logoMark()}<div class="brand-name">${esc(t('adminTitle'))}</div></div>
        <div class="topbar-actions">
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">${esc(t('backToStore'))}</a>
          <a href="#" class="admin-link" onclick="__actions.signOut();return false;">${esc(t('signOut'))}</a>
        </div>
      </header>
      <div class="admin-wrap">
        <div class="tabs">
          <button class="tab-btn ${state.adminTab==='products'?'active':''}" onclick="__actions.setAdminTab('products')">${esc(t('tabProducts'))}</button>
          <button class="tab-btn ${state.adminTab==='orders'?'active':''}" onclick="__actions.setAdminTab('orders')">${esc(t('tabOrders'))} (${state.orders.length})</button>
          <button class="tab-btn ${state.adminTab==='settings'?'active':''}" onclick="__actions.setAdminTab('settings')">${esc(t('tabSettings'))}</button>
        </div>
        ${state.adminTab==='products' ? renderAdminProducts() : ''}
        ${state.adminTab==='orders' ? renderAdminOrders() : ''}
        ${state.adminTab==='settings' ? renderAdminSettings() : ''}
      </div>
    `;
  }

  function renderAdminProducts(){
    const ep = state.editingProduct;
    const draftKey = ep ? String(ep.id) : 'new';
    let vals;
    if(state.productFormDraft && state.productFormDraft._key === draftKey){
      vals = state.productFormDraft;
    } else {
      vals = {
        name: ep?.name || '', price: ep?.price ?? '', image: ep?.image || '',
        images: ep?.images || '', description: ep?.description || '', badge: ep?.badge || '',
      };
      state.productFormDraft = { _key: draftKey, ...vals };
    }
    return `
      <div class="panel" id="product-form" style="margin-bottom:24px;">
        <h3>${ep ? esc(t('editProductTitle')) : esc(t('addProductTitle'))}</h3>
        <form onsubmit="__actions.saveProduct(event)" oninput="__actions.updateProductDraft(this)">
          <div class="form-grid">
            <div class="field"><label>${esc(t('fieldProductName'))}</label><input name="name" required value="${esc(vals.name)}"></div>
            <div class="field"><label>${esc(t('fieldPrice'))}</label><input name="price" type="number" step="0.01" required value="${esc(String(vals.price ?? ''))}"></div>
            <div class="field full"><label>${esc(t('fieldMainImage'))}</label><input name="image" placeholder="https://..." value="${esc(vals.image)}"></div>
            <div class="field full"><label>${esc(t('fieldGallery'))}</label><input name="images" placeholder="https://..., https://..." value="${esc(vals.images)}"></div>
            <div class="field full"><label>${esc(t('fieldDescription'))}</label><textarea name="description" rows="2">${esc(vals.description)}</textarea></div>
            <div class="field"><label>${esc(t('fieldBadge'))}</label><input name="badge" value="${esc(vals.badge)}"></div>
          </div>
          <button type="submit" class="save-btn">${ep ? esc(t('saveChanges')) : esc(t('addProductBtn'))}</button>
          ${ep ? `<button type="button" class="mini-btn" style="margin-inline-start:10px;" onclick="__actions.cancelEdit()">${esc(t('cancel'))}</button>` : ''}
        </form>
      </div>
      <div class="panel">
        <h3>${esc(t('currentProducts'))} (${state.products.length})</h3>
        ${state.products.length===0 ? `<p style="color:var(--ink-soft);">${esc(t('noProductsAdmin'))}</p>` : state.products.map(p=>`
          <div class="admin-product-row">
            ${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.outerHTML='<div class=ph>'+window.__actions._placeholderSvg()+'</div>'">` : `<div class="ph">${printPlaceholderIcon()}</div>`}
            <div class="info">
              <div class="n">${esc(p.name)}</div>
              <div class="p">${money(p.price)}</div>
            </div>
            <div class="row-actions">
              <button class="mini-btn" onclick="__actions.editProduct('${p.id}')">${esc(t('edit'))}</button>
              <button class="mini-btn danger" onclick="__actions.deleteProduct('${p.id}')">${esc(t('delete'))}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminOrders(){
    return `
      <div class="panel">
        <h3>${esc(t('ordersTitle'))}</h3>
        ${state.orders.length===0 ? `<p style="color:var(--ink-soft);">${esc(t('noOrders'))}</p>` : state.orders.map(o=>`
          <div class="order-card">
            <div class="top"><span>${esc(o.customer_name)}</span><span class="amt mono">${money(o.total)}</span></div>
            <div class="meta">
              ${esc(o.phone)}<br>
              ${esc(o.address)}<br>
              ${o.note ? `${esc(o.note)}<br>` : ''}
              ${new Date(o.created_at).toLocaleString('en-US')}
            </div>
            <ul>${o.items.map(it=>`<li>${esc(it.name)} × ${it.qty} — ${money(it.price*it.qty)}</li>`).join('')}</ul>
            <button class="mini-btn danger" style="margin-top:10px;" onclick="__actions.cancelOrder('${o.id}')">${esc(t('cancelOrder'))}</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminSettings(){
    const s = state.settings;
    return `
      <div class="panel">
        <h3>${esc(t('storeSettingsTitle'))}</h3>
        <div class="muted-note">${esc(t('settingsNote'))}</div>
        <form onsubmit="__actions.saveSettings(event)">
          <div class="field"><label>${esc(t('fieldStoreName'))}</label><input name="sname" required value="${esc(s.name)}"></div>
          <div class="field"><label>${esc(t('fieldTagline'))}</label><textarea name="tagline" rows="2">${esc(s.tagline)}</textarea></div>
          <button type="submit" class="save-btn">${esc(t('save'))}</button>
        </form>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(state.loading){
      app.innerHTML = `<div class="loading-box mono">${esc(t('loading'))}</div>`;
      return;
    }
    if(state.view === 'admin'){ app.innerHTML = renderAdmin(); }
    else if(state.view === 'product'){ app.innerHTML = renderProduct(); }
    else { app.innerHTML = renderStore(); }
  }

  // ---------- gallery keyboard + swipe (registered once, delegated) ----------
  document.addEventListener('keydown', (e) => {
    if(state.view !== 'product') return;
    if(e.key === 'ArrowLeft') A.pdPrev();
    if(e.key === 'ArrowRight') A.pdNext();
  });

  let pdTouchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    if(state.view !== 'product') return;
    if(!e.target.closest('#pdMainWrap')) return;
    pdTouchStartX = e.touches[0].clientX;
  }, { passive:true });
  document.addEventListener('touchend', (e) => {
    if(state.view !== 'product') return;
    if(!e.target.closest('#pdMainWrap')) return;
    const dx = e.changedTouches[0].clientX - pdTouchStartX;
    if(Math.abs(dx) > 40){ dx > 0 ? A.pdPrev() : A.pdNext(); }
  }, { passive:true });

  // ---------- hero scene tilt parallax ----------
  document.addEventListener('mousemove', (e) => {
    const scene = document.querySelector('.hero-scene svg');
    if(!scene) return;
    const rect = scene.parentElement.getBoundingClientRect();
    if(e.clientX < rect.left - 60 || e.clientX > rect.right + 60 || e.clientY < rect.top - 60 || e.clientY > rect.bottom + 60) return;
    const px = (e.clientX - (rect.left + rect.width/2)) / rect.width;
    const py = (e.clientY - (rect.top + rect.height/2)) / rect.height;
    scene.style.transform = `rotateY(${px*10}deg) rotateX(${-py*10}deg)`;
  });
  document.addEventListener('mouseleave', () => {
    const scene = document.querySelector('.hero-scene svg');
    if(scene) scene.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });

  loadAll();
})();
</script>
</body>
</html>
