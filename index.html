<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --pink:#FF3B30;
    --pink-deep:#E5241A;
    --lavender:#111111;
    --gold:#111111;
    --mint:#F2F2F2;
    --ink:#111111;
    --ink-soft:#666666;
    --radius:12px;
    --shadow:0 4px 16px rgba(0,0,0,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid #EAEAEA;
    padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo-badge{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--lavender));
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:var(--shadow);
  }
  .brand-name{font-size:22px;color:var(--ink);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    position:relative;
    width:42px;height:42px;border-radius:50%;
    background:#fff;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;transition:transform .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);}
  .cart-count{
    position:absolute;top:-4px;left:-4px;
    background:var(--pink-deep);color:#fff;
    font-size:11px;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .admin-link{
    font-size:13px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
    padding:8px 12px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:linear-gradient(135deg,var(--pink) 0%,var(--lavender) 100%);
    color:#fff;
    padding:64px 24px 90px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,rgba(255,255,255,0.35) 2px,transparent 2px);
    background-size:38px 38px;opacity:.5;
  }
  .hero-inner{position:relative;max-width:640px;margin:0 auto;}
  .hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 12px;line-height:1.2;}
  .hero p{font-size:17px;opacity:.95;margin:0 auto 26px;max-width:480px;}
  .hero .settings-hint{font-size:13px;opacity:.8;margin-top:18px;}
  .cta-btn{
    display:inline-block;background:#fff;color:var(--pink-deep);
    font-weight:800;font-family:'Cairo',sans-serif;
    padding:14px 30px;border-radius:999px;font-size:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    transition:transform .15s ease;
  }
  .cta-btn:hover{transform:translateY(-2px) scale(1.02);}

  .scallop{
    position:absolute;left:0;right:0;bottom:-1px;height:34px;
    background:radial-gradient(circle at 17px 0, var(--bg) 17px, transparent 18px) 0 0/34px 34px repeat-x;
  }

  /* ---------- Products ---------- */
  main{max-width:1180px;margin:0 auto;padding:56px 24px 90px;}
  .section-head{text-align:center;margin-bottom:36px;}
  .section-head .eyebrow{
    color:var(--pink-deep);font-weight:700;font-size:13px;letter-spacing:.5px;
  }
  .section-head h2{font-size:30px;margin:6px 0 0;}

  .empty-state{
    text-align:center;padding:70px 20px;background:#fff;border-radius:28px;
    box-shadow:var(--shadow);max-width:520px;margin:0 auto;
  }
  .empty-state .emoji{font-size:44px;display:block;margin-bottom:14px;}
  .empty-state h3{margin:0 0 8px;font-size:22px;}
  .empty-state p{color:var(--ink-soft);margin:0 0 22px;line-height:1.7;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;
  }
  .product-card{
    background:var(--card);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .18s ease;position:relative;cursor:pointer;
  }
  .product-card:hover{transform:translateY(-4px);}
  .product-media{
    aspect-ratio:1/1;background:linear-gradient(135deg,#F5F5F5,#EDEDED);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;
  }
  .product-media img{width:100%;height:100%;object-fit:cover;}
  .product-media .placeholder{font-size:40px;opacity:.5;}
  .media-count{
    position:absolute;bottom:8px;left:8px;background:rgba(17,17,17,0.65);color:#fff;
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  }
  .badge{
    position:absolute;top:12px;right:12px;background:var(--gold);
    color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;
  }
  .product-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .product-body h3{font-size:17px;margin:0;}
  .product-desc{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .price{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;color:var(--pink-deep);}
  .add-btn{
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;
    transition:background .15s ease;
  }
  .add-btn:hover{background:var(--pink-deep);}

  /* ---------- Product detail modal ---------- */
  .pmodal-overlay{
    position:fixed;inset:0;background:rgba(17,17,17,0.5);z-index:60;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .pmodal-overlay.open{opacity:1;pointer-events:auto;}
  .pmodal{
    background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);position:relative;
    transform:translateY(16px);transition:transform .2s ease;
  }
  .pmodal-overlay.open .pmodal{transform:translateY(0);}
  .pmodal-close{
    position:absolute;top:14px;left:14px;z-index:2;
    width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-soft);
  }
  .pmodal-grid{display:grid;grid-template-columns:1fr 1fr;}
  @media(max-width:620px){.pmodal-grid{grid-template-columns:1fr;}}
  .pmodal-gallery{background:#F5F5F5;}
  .pmodal-main-img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pmodal-main-img img{width:100%;height:100%;object-fit:cover;}
  .pmodal-main-img .placeholder{font-size:56px;opacity:.5;}
  .pmodal-thumbs{display:flex;gap:8px;padding:12px;overflow-x:auto;}
  .pmodal-thumb{
    width:54px;height:54px;border-radius:10px;overflow:hidden;flex-shrink:0;cursor:pointer;
    border:2px solid transparent;opacity:.65;
  }
  .pmodal-thumb.active{border-color:var(--pink-deep);opacity:1;}
  .pmodal-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pmodal-info{padding:26px;display:flex;flex-direction:column;gap:10px;}
  .pmodal-info h3{font-size:22px;margin:0;}
  .pmodal-info .price{font-size:22px;}
  .pmodal-info .product-desc{-webkit-line-clamp:unset;font-size:14px;}
  .pmodal-info .add-btn{padding:13px 18px;font-size:14px;margin-top:10px;}

  /* ---------- Cart drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(58,46,63,0.35);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);
    background:#fff;z-index:51;transform:translateX(-100%);
    transition:transform .25s ease;display:flex;flex-direction:column;
    box-shadow:10px 0 30px rgba(0,0,0,0.12);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:20px;border-bottom:1px solid #EAEAEA;display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{margin:0;font-size:19px;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #EEEEEE;}
  .cart-item img,.cart-item .ph{width:60px;height:60px;border-radius:14px;object-fit:cover;background:#F2F2F2;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .cart-item-info{flex:1;display:flex;flex-direction:column;gap:4px;}
  .cart-item-info .name{font-weight:600;font-size:14px;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:26px;height:26px;border-radius:8px;background:var(--bg);font-weight:700;}
  .remove-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;margin-inline-start:auto;}
  .drawer-foot{padding:18px 20px;border-top:1px solid #EAEAEA;}
  .total-row{display:flex;justify-content:space-between;font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;margin-bottom:14px;}
  .checkout-btn{
    width:100%;background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;padding:14px;border-radius:14px;font-weight:700;font-size:15px;
  }
  .close-x{font-size:20px;color:var(--ink-soft);}

  /* ---------- Checkout form ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);}
  .field input,.field textarea{
    width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid #E0E0E0;background:var(--bg);
    font-size:14px;
  }
  .field input:focus,.field textarea:focus{border-color:var(--pink-deep);outline:none;}

  .success-box{text-align:center;padding:20px 6px;}
  .success-box .emoji{font-size:48px;display:block;margin-bottom:10px;}

  /* ---------- Admin ---------- */
  .admin-wrap{max-width:900px;margin:0 auto;padding:40px 20px 90px;}
  .admin-gate{max-width:360px;margin:80px auto;background:#fff;padding:32px;border-radius:24px;box-shadow:var(--shadow);text-align:center;}
  .admin-gate .emoji{font-size:38px;}
  .tabs{display:flex;gap:8px;margin-bottom:26px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow);width:fit-content;}
  .tab-btn{padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-soft);}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .panel{background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow);}
  .panel h3{margin-top:0;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
  .save-btn{
    background:var(--pink-deep);color:#fff;padding:12px 26px;border-radius:12px;font-weight:700;margin-top:6px;
  }
  .admin-product-row{
    display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #EEEEEE;
  }
  .admin-product-row img,.admin-product-row .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#F2F2F2;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .admin-product-row .info{flex:1;}
  .admin-product-row .info .n{font-weight:700;font-size:14px;}
  .admin-product-row .info .p{font-size:13px;color:var(--ink-soft);}
  .row-actions{display:flex;gap:8px;}
  .mini-btn{background:#F2F2F2;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;}
  .mini-btn.danger{color:var(--pink-deep);}
  .order-card{border:1px solid #EEEEEE;border-radius:16px;padding:16px;margin-bottom:14px;}
  .order-card .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;}
  .order-card .meta{font-size:13px;color:var(--ink-soft);margin-bottom:8px;line-height:1.7;}
  .order-card ul{margin:0;padding-inline-start:18px;font-size:13px;}
  .muted-note{font-size:12px;color:var(--ink-soft);background:var(--bg);padding:10px 14px;border-radius:12px;margin-bottom:18px;line-height:1.7;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;
    z-index:80;transition:transform .25s ease;box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .loading-box{text-align:center;padding:100px 20px;color:var(--ink-soft);}
  footer{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px;}

  /* ---------- Multi-image field (admin) ---------- */
  #images-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .img-row{display:flex;gap:8px;align-items:center;}
  .img-row input{flex:1;}
  .img-row .img-remove{
    background:#F2F2F2;color:var(--pink-deep);width:34px;height:34px;border-radius:9px;
    flex-shrink:0;font-size:16px;font-weight:700;
  }
  .add-img-btn{
    background:var(--mint);color:var(--ink);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;
    margin-bottom:14px;
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ⚠️ حطي بيانات مشروعك من Supabase هنا (Project Settings → API)
  const SUPABASE_URL = 'https://myvxroegtectghbalnom.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15dnhyb2VndGVjdGdoYmFsbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTk5MjcsImV4cCI6MjEwMjQ3NTkyN30.hAJ2nt8ib_oQHmEBHxshH03OkSs1E-iqxt5dkNLNFFA';
</script>
<script>
(function(){
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const state = {
    view: 'store', // store | admin
    adminTab: 'products', // products | orders | settings
    adminAuthed: false,
    loading: true,
    products: [],
    orders: [],
    settings: { name: 'متجري ✨', tagline: 'حاجات حلوة ومخصوصة، ضيفيها إنتي بنفسك.' },
    cart: {}, // id -> qty
    drawerOpen: false,
    checkoutStep: 'cart', // cart | form | success
    editingProduct: null,
    selectedProductId: null, // for product detail modal
    galleryIndex: 0,
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){ return Number(n||0).toLocaleString('ar-EG') + ' ج.م'; }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // returns an array of image urls for a product, robust to old single-image rows
  function productImages(p){
    if(Array.isArray(p.images) && p.images.length) return p.images.filter(Boolean);
    if(p.image) return [p.image];
    return [];
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function loadCart(){
    try{ return JSON.parse(localStorage.getItem('cart')||'{}'); }catch(e){ return {}; }
  }
  function persistCart(){ localStorage.setItem('cart', JSON.stringify(state.cart)); }

  async function refreshProducts(){
    const { data, error } = await supabase.from('products').select('*').order('created_at',{ascending:true});
    if(!error && data) state.products = data;
  }
  async function refreshOrders(){
    const { data, error } = await supabase.from('orders').select('*').order('created_at',{ascending:false});
    if(!error && data) state.orders = data;
  }
  async function refreshSettings(){
    const { data, error } = await supabase.from('store_settings').select('*').eq('id',1).single();
    if(!error && data) state.settings = { name: data.name, tagline: data.tagline };
  }

  async function loadAll(){
    try{
      const { data: { session } } = await supabase.auth.getSession();
      state.adminAuthed = !!session;
      await Promise.all([refreshProducts(), refreshSettings()]);
      state.cart = loadCart();
      if(location.hash === '#admin'){ state.view = 'admin'; }
      if(state.adminAuthed && state.view === 'admin'){ await refreshOrders(); }
      state.loading = false;
      render();
    }catch(err){
      state.loading = false;
      state.loadError = (err && err.message) ? err.message : 'حصل خطأ في الاتصال بقاعدة البيانات';
      render();
    }
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    state.adminAuthed = !!session;
    render();
  });

  function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const p = state.products.find(x=>x.id===id);
      return p ? {...p, qty} : null;
    }).filter(Boolean);
  }
  function cartTotal(){ return cartItems().reduce((sum,it)=>sum+it.price*it.qty,0); }

  // ---------- actions ----------
  window.__actions = {
    addToCart(id){
      state.cart[id] = (state.cart[id]||0)+1;
      persistCart();
      showToast('اتضافت للسلة ✨');
      render();
    },
    changeQty(id, delta){
      const next = (state.cart[id]||0)+delta;
      if(next<=0) delete state.cart[id]; else state.cart[id]=next;
      persistCart();
      render();
    },
    removeFromCart(id){
      delete state.cart[id];
      persistCart();
      render();
    },
    openDrawer(){ state.drawerOpen = true; state.checkoutStep='cart'; render(); },
    closeDrawer(){ state.drawerOpen = false; render(); },
    goToForm(){ if(cartItems().length===0) return; state.checkoutStep='form'; render(); },
    backToCart(){ state.checkoutStep='cart'; render(); },
    async submitOrder(ev){
      ev.preventDefault();
      const f = ev.target;
      const order = {
        customer_name: f.name.value.trim(),
        phone: f.phone.value.trim(),
        address: f.address.value.trim(),
        note: f.note.value.trim(),
        items: cartItems().map(it=>({id:it.id,name:it.name,price:it.price,qty:it.qty})),
        total: cartTotal(),
      };
      const { error } = await supabase.from('orders').insert(order);
      if(error){ showToast('حصل خطأ، جربي تاني'); return; }
      state.cart = {};
      persistCart();
      state.checkoutStep = 'success';
      render();
    },
    goAdmin(){ state.view='admin'; location.hash='admin'; render(); },
    goStore(){ state.view='store'; history.replaceState(null,'',location.pathname+location.search); render(); },
    async tryAuth(ev){
      ev.preventDefault();
      const f = ev.target;
      const { error } = await supabase.auth.signInWithPassword({
        email: f.email.value.trim(),
        password: f.password.value,
      });
      if(error){ showToast('بيانات الدخول غلط'); return; }
      await refreshOrders();
      render();
    },
    async signOut(){
      await supabase.auth.signOut();
      state.view = 'store';
      history.replaceState(null,'',location.pathname+location.search);
      render();
    },
    async setAdminTab(tab){
      state.adminTab = tab; state.editingProduct=null;
      if(tab==='orders') await refreshOrders();
      render();
    },
    editProduct(id){
      state.editingProduct = state.products.find(p=>p.id===id) || null;
      state.adminTab = 'products';
      render();
      document.getElementById('product-form')?.scrollIntoView({behavior:'smooth'});
    },
    cancelEdit(){ state.editingProduct = null; render(); },
    async deleteProduct(id){
      if(!confirm('متأكدة إنك عايزة تمسحي المنتج ده؟')) return;
      const { error } = await supabase.from('products').delete().eq('id', id);
      if(error){ showToast('حصل خطأ في الحذف'); return; }
      await refreshProducts();
      showToast('اتمسح المنتج');
      render();
    },
    async saveProduct(ev){
      ev.preventDefault();
      const f = ev.target;
      const images = Array.from(f.querySelectorAll('input[name="images[]"]'))
        .map(i=>i.value.trim())
        .filter(Boolean);
      const data = {
        name: f.name.value.trim(),
        price: parseFloat(f.price.value) || 0,
        images: images,
        image: images[0] || '', // keep legacy column in sync for backward compatibility
        description: f.description.value.trim(),
        badge: f.badge.value.trim(),
      };
      if(!data.name || !data.price){ showToast('لازم اسم وسعر للمنتج'); return; }
      let error;
      if(state.editingProduct){
        ({ error } = await supabase.from('products').update(data).eq('id', state.editingProduct.id));
        if(!error) showToast('اتحدث المنتج ✨');
        state.editingProduct = null;
      } else {
        ({ error } = await supabase.from('products').insert(data));
        if(!error) showToast('اتضاف المنتج ✨');
      }
      if(error){ showToast('حصل خطأ، جربي تاني'); return; }
      await refreshProducts();
      f.reset();
      render();
    },
    async saveSettings(ev){
      ev.preventDefault();
      const f = ev.target;
      const data = { name: f.sname.value.trim() || 'متجري ✨', tagline: f.tagline.value.trim() };
      const { error } = await supabase.from('store_settings').update(data).eq('id',1);
      if(error){ showToast('حصل خطأ، جربي تاني'); return; }
      state.settings = data;
      showToast('اتحفظت الإعدادات');
      render();
    },
    // ---- product detail modal ----
    openProduct(id){
      state.selectedProductId = id;
      state.galleryIndex = 0;
      render();
    },
    closeProduct(){
      state.selectedProductId = null;
      render();
    },
    setGalleryIndex(i){
      state.galleryIndex = i;
      render();
    },
  };
  const A = window.__actions;

  // ---- image-list rows in the admin product form (kept outside render() so typing doesn't lose focus) ----
  window.__imgActions = {
    add(url){
      const list = document.getElementById('images-list');
      if(!list) return;
      const row = document.createElement('div');
      row.className = 'img-row';
      row.innerHTML = `
        <input type="text" name="images[]" placeholder="https://..." value="${esc(url||'')}">
        <button type="button" class="img-remove" onclick="__imgActions.remove(this)">✕</button>
      `;
      list.appendChild(row);
    },
    remove(btn){
      btn.closest('.img-row')?.remove();
    }
  };

  // ---------- render pieces ----------
  function productMedia(p){
    const imgs = productImages(p);
    const inner = imgs.length
      ? `<img src="${esc(imgs[0])}" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML='<span class=placeholder>🪄</span>'">`
      : `<span class="placeholder">🪄</span>`;
    const count = imgs.length>1 ? `<span class="media-count">📷 ${imgs.length}</span>` : '';
    return `<div class="product-media">${inner}${count}</div>`;
  }

  function renderStore(){
    const s = state.settings;
    return `
      <header class="topbar">
        <div class="brand">
          <div class="logo-badge">🪄</div>
          <div class="brand-name">${esc(s.name)}</div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" onclick="__actions.openDrawer()" aria-label="السلة">
            🛍️
            ${cartCount()>0 ? `<span class="cart-count">${cartCount()}</span>` : ''}
          </button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-inner">
          <h1>${esc(s.name)}</h1>
          <p>${esc(s.tagline)}</p>
          <a href="#products" class="cta-btn">تسوقي دلوقتي</a>
        </div>
        <div class="scallop"></div>
      </section>

      <main id="products">
        <div class="section-head">
          <div class="eyebrow">المنتجات</div>
          <h2>كل حاجة هنا مختارة بحب</h2>
        </div>
        ${state.products.length === 0 ? `
          <div class="empty-state">
            <span class="emoji">✨</span>
            <h3>لسه مفيش منتجات</h3>
            <p>هتلاقي هنا كل المنتجات المتاحة أول ما تتضاف.</p>
          </div>
        ` : `
          <div class="grid">
            ${state.products.map(p=>`
              <div class="product-card" onclick="__actions.openProduct('${p.id}')">
                ${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ''}
                ${productMedia(p)}
                <div class="product-body">
                  <h3>${esc(p.name)}</h3>
                  ${p.description ? `<p class="product-desc">${esc(p.description)}</p>` : ''}
                  <div class="price-row">
                    <span class="price">${money(p.price)}</span>
                    <button class="add-btn" onclick="event.stopPropagation();__actions.addToCart('${p.id}')">أضيفي للسلة</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </main>

      <footer>صُنع بحب 💌 — الدفع الحقيقي لسه مش متفعل، الطلبات بتتسجل وتقدري تتواصلي مع العميل بنفسك.</footer>

      ${renderDrawer()}
      ${renderProductModal()}
    `;
  }

  function renderProductModal(){
    const id = state.selectedProductId;
    if(!id) return '';
    const p = state.products.find(x=>x.id===id);
    if(!p) return '';
    const imgs = productImages(p);
    const main = imgs[state.galleryIndex] || imgs[0];
    const mainHtml = main
      ? `<img src="${esc(main)}" alt="${esc(p.name)}" onerror="this.parentElement.innerHTML='<span class=placeholder>🪄</span>'">`
      : `<span class="placeholder">🪄</span>`;

    return `
      <div class="pmodal-overlay open" onclick="if(event.target===this) __actions.closeProduct()">
        <div class="pmodal">
          <button class="pmodal-close" onclick="__actions.closeProduct()">✕</button>
          <div class="pmodal-grid">
            <div class="pmodal-gallery">
              <div class="pmodal-main-img">${mainHtml}</div>
              ${imgs.length>1 ? `
                <div class="pmodal-thumbs">
                  ${imgs.map((im,i)=>`
                    <div class="pmodal-thumb ${i===state.galleryIndex?'active':''}" onclick="__actions.setGalleryIndex(${i})">
                      <img src="${esc(im)}" alt="">
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
            <div class="pmodal-info">
              ${p.badge ? `<span class="badge" style="position:static;align-self:flex-start;">${esc(p.badge)}</span>` : ''}
              <h3>${esc(p.name)}</h3>
              <span class="price">${money(p.price)}</span>
              ${p.description ? `<p class="product-desc">${esc(p.description)}</p>` : ''}
              <button class="add-btn" onclick="__actions.addToCart('${p.id}')">أضيفي للسلة</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderDrawer(){
    const items = cartItems();
    let body;
    if(state.checkoutStep === 'success'){
      body = `
        <div class="success-box">
          <span class="emoji">🎉</span>
          <h3>اتسجل طلبك!</h3>
          <p style="color:var(--ink-soft);line-height:1.7;">هنتواصل معاكي على الرقم اللي كتبتيه لتأكيد الطلب والدفع.</p>
          <button class="checkout-btn" style="margin-top:16px;" onclick="__actions.closeDrawer()">تمام</button>
        </div>`;
    } else if(state.checkoutStep === 'form'){
      body = `
        <form onsubmit="__actions.submitOrder(event)">
          <div class="field"><label>الاسم</label><input name="name" required placeholder="اسمك"></div>
          <div class="field"><label>رقم الموبايل</label><input name="phone" required placeholder="01xxxxxxxxx"></div>
          <div class="field"><label>العنوان</label><textarea name="address" rows="2" required placeholder="المحافظة، المنطقة، تفاصيل العنوان"></textarea></div>
          <div class="field"><label>ملاحظات (اختياري)</label><textarea name="note" rows="2" placeholder="أي تفاصيل حابة تقوليها"></textarea></div>
          <button type="button" class="mini-btn" style="margin-bottom:10px;" onclick="__actions.backToCart()">⟵ رجوع للسلة</button>
          <button type="submit" class="checkout-btn">تأكيد الطلب</button>
        </form>`;
    } else {
      body = items.length === 0
        ? `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;">السلة فاضية دلوقتي 🛍️</p>`
        : items.map(it=>`
            <div class="cart-item">
              ${(productImages(it)[0]) ? `<img src="${esc(productImages(it)[0])}" alt="">` : `<div class="ph">🪄</div>`}
              <div class="cart-item-info">
                <span class="name">${esc(it.name)}</span>
                <span style="font-size:13px;color:var(--ink-soft);">${money(it.price)}</span>
                <div class="qty-row">
                  <button class="qty-btn" onclick="__actions.changeQty('${it.id}',-1)">−</button>
                  <span>${it.qty}</span>
                  <button class="qty-btn" onclick="__actions.changeQty('${it.id}',1)">+</button>
                  <a href="#" class="remove-link" onclick="__actions.removeFromCart('${it.id}');return false;">حذف</a>
                </div>
              </div>
            </div>
          `).join('');
    }

    return `
      <div class="overlay ${state.drawerOpen?'open':''}" onclick="__actions.closeDrawer()"></div>
      <aside class="drawer ${state.drawerOpen?'open':''}">
        <div class="drawer-head">
          <h3>السلة</h3>
          <button class="close-x" onclick="__actions.closeDrawer()">✕</button>
        </div>
        <div class="drawer-body">${body}</div>
        ${state.checkoutStep==='cart' ? `
          <div class="drawer-foot">
            <div class="total-row"><span>الإجمالي</span><span>${money(cartTotal())}</span></div>
            <button class="checkout-btn" ${items.length===0?'disabled style="opacity:.5;"':''} onclick="__actions.goToForm()">إتمام الطلب</button>
          </div>
        ` : ''}
      </aside>
    `;
  }

  function renderAdmin(){
    if(!state.adminAuthed){
      return `
        <header class="topbar">
          <div class="brand"><div class="logo-badge">🔧</div><div class="brand-name">لوحة التحكم</div></div>
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">⟵ رجوع للمتجر</a>
        </header>
        <div class="admin-gate">
          <span class="emoji">🔐</span>
          <h3>دخول لوحة التحكم</h3>
          <p style="color:var(--ink-soft);font-size:13px;">بحساب الأدمن بتاعك في Supabase، إنتي بس اللي تقدري تدخلي بيه.</p>
          <form onsubmit="__actions.tryAuth(event)">
            <div class="field"><input name="email" type="email" placeholder="الإيميل" required></div>
            <div class="field"><input name="password" type="password" placeholder="كلمة السر" required></div>
            <button type="submit" class="save-btn" style="width:100%;">دخول</button>
          </form>
        </div>
      `;
    }

    return `
      <header class="topbar">
        <div class="brand"><div class="logo-badge">🔧</div><div class="brand-name">لوحة التحكم</div></div>
        <div class="topbar-actions">
          <a href="#" class="admin-link" onclick="__actions.goStore();return false;">⟵ رجوع للمتجر</a>
          <a href="#" class="admin-link" onclick="__actions.signOut();return false;">🚪 خروج</a>
        </div>
      </header>
      <div class="admin-wrap">
        <div class="tabs">
          <button class="tab-btn ${state.adminTab==='products'?'active':''}" onclick="__actions.setAdminTab('products')">المنتجات</button>
          <button class="tab-btn ${state.adminTab==='orders'?'active':''}" onclick="__actions.setAdminTab('orders')">الطلبات (${state.orders.length})</button>
          <button class="tab-btn ${state.adminTab==='settings'?'active':''}" onclick="__actions.setAdminTab('settings')">إعدادات المتجر</button>
        </div>
        ${state.adminTab==='products' ? renderAdminProducts() : ''}
        ${state.adminTab==='orders' ? renderAdminOrders() : ''}
        ${state.adminTab==='settings' ? renderAdminSettings() : ''}
      </div>
    `;
  }

  function renderAdminProducts(){
    const ep = state.editingProduct;
    const initialImages = ep ? productImages(ep) : [];
    const imagesRowsHtml = (initialImages.length ? initialImages : ['']).map(url=>`
      <div class="img-row">
        <input type="text" name="images[]" placeholder="https://..." value="${esc(url)}">
        <button type="button" class="img-remove" onclick="__imgActions.remove(this)">✕</button>
      </div>
    `).join('');

    return `
      <div class="panel" id="product-form" style="margin-bottom:24px;">
        <h3>${ep ? 'تعديل المنتج' : 'إضافة منتج جديد'}</h3>
        <form onsubmit="__actions.saveProduct(event)">
          <div class="form-grid">
            <div class="field"><label>اسم المنتج</label><input name="name" required value="${esc(ep?.name||'')}"></div>
            <div class="field"><label>السعر (ج.م)</label><input name="price" type="number" step="0.01" required value="${ep?.price??''}"></div>
            <div class="field full">
              <label>صور المنتج (تقدري تضيفي أكتر من صورة)</label>
              <div id="images-list">${imagesRowsHtml}</div>
              <button type="button" class="add-img-btn" onclick="__imgActions.add('')">+ إضافة صورة تانية</button>
            </div>
            <div class="field full"><label>الوصف</label><textarea name="description" rows="2">${esc(ep?.description||'')}</textarea></div>
            <div class="field"><label>شارة (اختياري، زي "الأكثر مبيعًا")</label><input name="badge" value="${esc(ep?.badge||'')}"></div>
          </div>
          <button type="submit" class="save-btn">${ep ? 'حفظ التعديلات' : 'إضافة المنتج'}</button>
          ${ep ? `<button type="button" class="mini-btn" style="margin-inline-start:10px;" onclick="__actions.cancelEdit()">إلغاء</button>` : ''}
        </form>
      </div>
      <div class="panel">
        <h3>المنتجات الحالية (${state.products.length})</h3>
        ${state.products.length===0 ? `<p style="color:var(--ink-soft);">لسه مفيش منتجات مضافة.</p>` : state.products.map(p=>`
          <div class="admin-product-row">
            ${productImages(p)[0] ? `<img src="${esc(productImages(p)[0])}" alt="" onerror="this.outerHTML='<div class=ph>🪄</div>'">` : `<div class="ph">🪄</div>`}
            <div class="info">
              <div class="n">${esc(p.name)} ${productImages(p).length>1 ? `<span style="color:var(--ink-soft);font-weight:400;">(${productImages(p).length} صور)</span>` : ''}</div>
              <div class="p">${money(p.price)}</div>
            </div>
            <div class="row-actions">
              <button class="mini-btn" onclick="__actions.editProduct('${p.id}')">تعديل</button>
              <button class="mini-btn danger" onclick="__actions.deleteProduct('${p.id}')">حذف</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminOrders(){
    return `
      <div class="panel">
        <h3>الطلبات</h3>
        ${state.orders.length===0 ? `<p style="color:var(--ink-soft);">لسه مفيش طلبات.</p>` : state.orders.map(o=>`
          <div class="order-card">
            <div class="top"><span>${esc(o.customer_name)}</span><span>${money(o.total)}</span></div>
            <div class="meta">
              📱 ${esc(o.phone)}<br>
              📍 ${esc(o.address)}<br>
              ${o.note ? `📝 ${esc(o.note)}<br>` : ''}
              🕒 ${new Date(o.created_at).toLocaleString('ar-EG')}
            </div>
            <ul>${o.items.map(it=>`<li>${esc(it.name)} × ${it.qty} — ${money(it.price*it.qty)}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderAdminSettings(){
    const s = state.settings;
    return `
      <div class="panel">
        <h3>إعدادات المتجر</h3>
        <div class="muted-note">المنتجات والطلبات والإعدادات محفوظة دائمًا في قاعدة بيانات Supabase — متاحة لأي زائر يفتح رابط المتجر، ومتضيعش أبدًا بالريفريش. سلة كل زائر شخصية بس (محفوظة على متصفحه هو).</div>
        <form onsubmit="__actions.saveSettings(event)">
          <div class="field"><label>اسم المتجر</label><input name="sname" required value="${esc(s.name)}"></div>
          <div class="field"><label>الجملة الترحيبية</label><textarea name="tagline" rows="2">${esc(s.tagline)}</textarea></div>
          <button type="submit" class="save-btn">حفظ</button>
        </form>
      </div>
    `;
  }

  function render(){
    const app = document.getElementById('app');
    if(state.loading){
      app.innerHTML = `<div class="loading-box">✨ بنجهز متجرك...</div>`;
      return;
    }
    app.innerHTML = state.view === 'admin' ? renderAdmin() : renderStore();
  }

  loadAll();
})();
</script>
</body>
</html>
